<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一图一表 - 程钰的百宝箱</title>
    <link rel="stylesheet" href="/static/css/style.css?v=13">
    <style>
    /* 产品列表视图 */
    .prod-layout { display: flex; flex-direction: column; gap: 12px; }
    .prod-header { display: flex; align-items: center; justify-content: space-between; }
    .prod-search {
        padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
        font-size: 13px; background: var(--bg-page); color: var(--text-primary); outline: none; width: 240px;
    }
    .prod-search:focus { border-color: var(--accent); }
    .prod-table-wrap { overflow-x: auto; }
    .prod-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .prod-table th, .prod-table td {
        padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .prod-table th { background: var(--bg-page); font-weight: 600; color: var(--text-muted); font-size: 12px; }
    .prod-table tbody tr:hover { background: var(--bg-card-hover); }
    .prod-empty { text-align: center; color: var(--text-muted); padding: 48px 0; }
    .prod-actions { display: flex; gap: 4px; }
    .prod-btn {
        padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px;
        background: var(--bg-card); color: var(--text-secondary); font-size: 12px;
        cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .prod-btn:hover { background: var(--bg-card-hover); }
    .prod-btn--primary { color: var(--accent); border-color: var(--accent); }
    .prod-btn--danger { color: #ff3b30; }
    .prod-btn--danger:hover { background: #fff0ef; }

    /* 产品编辑 Modal */
    .prod-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .prod-form-group { display: flex; flex-direction: column; gap: 4px; }
    .prod-form-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .prod-form-group input, .prod-form-group textarea {
        padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
        font-size: 13px; font-family: inherit; background: var(--bg-page);
        color: var(--text-primary); outline: none;
    }
    .prod-form-group input:focus, .prod-form-group textarea:focus { border-color: var(--accent); }
    .prod-form-group textarea { resize: vertical; }
    .prod-form-group.full { grid-column: 1 / -1; }

    /* 流程图视图 */
    .flow-layout {
        display: flex; gap: 16px; height: calc(100vh - 180px); min-height: 400px;
    }
    .flow-steps-panel {
        width: 340px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto;
    }
    .flow-svg-panel {
        flex: 1; min-width: 0; background: var(--bg-card); border-radius: var(--radius);
        box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden;
    }
    .flow-svg-toolbar {
        display: flex; align-items: center; gap: 8px; padding: 10px 14px;
        border-bottom: 1px solid var(--border);
    }
    .flow-svg-wrap {
        flex: 1;
        min-height: 0;   /* 关键：允许 flex 子元素在内容超出时触发 overflow */
        padding: 20px;
        overflow: auto;
    }
    .flow-svg-wrap svg { display: block; }
    .flow-expand-btn { cursor: pointer; transition: fill 0.15s; }
    .flow-expand-btn:hover { fill: #0056b3; }
    .flow-title-input {
        width: 100%; padding: 10px 12px; border: 1px solid var(--border);
        border-radius: var(--radius-sm); font-size: 14px; font-family: inherit;
        background: var(--bg-card); color: var(--text-primary); outline: none;
    }
    .flow-title-input:focus { border-color: var(--accent); }
    .flow-step-item {
        display: flex; align-items: center; gap: 8px; background: var(--bg-card);
        border-radius: var(--radius-sm); padding: 10px 12px; box-shadow: var(--shadow);
        border: 2px solid transparent; transition: border-color 0.15s; cursor: grab;
    }
    .flow-step-item:active { cursor: grabbing; }
    .flow-step-item.dragging { opacity: 0.4; border-color: var(--accent); }
    .flow-step-item.drag-over { border-color: var(--accent); background: var(--accent-light); }
    .flow-step-item[data-level="2"] { margin-left: 24px; }
    .flow-step-item[data-level="3"] { margin-left: 48px; }
    .flow-step-level-badge {
        padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600;
    }
    .flow-step-level-badge[data-level="1"] { background: #007aff; color: #fff; }
    .flow-step-level-badge[data-level="2"] { background: #ff9500; color: #fff; }
    .flow-step-level-badge[data-level="3"] { background: #34c759; color: #fff; }
    .flow-step-num {
        width: 24px; height: 24px; border-radius: 50%; background: var(--accent);
        color: #fff; font-size: 12px; font-weight: 700; display: flex;
        align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px;
    }
    .flow-step-body { flex: 1; min-width: 0; }
    .flow-step-name { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
    .flow-step-desc { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .flow-step-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .flow-step-btn {
        border: none; background: none; color: var(--text-muted); cursor: pointer;
        padding: 2px 4px; border-radius: 4px; font-size: 14px;
    }
    .flow-step-btn:hover { color: var(--accent); background: var(--accent-light); }
    .flow-step-btn--danger:hover { color: #ff3b30; background: #fff0ef; }
    .flow-step-form {
        background: var(--bg-card); border-radius: var(--radius-sm); padding: 12px;
        box-shadow: var(--shadow); border: 1px dashed var(--accent);
        display: flex; flex-direction: column; gap: 8px;
    }
    .flow-step-form input, .flow-step-form textarea {
        width: 100%; padding: 8px 10px; border: 1px solid var(--border);
        border-radius: 6px; font-size: 13px; font-family: inherit;
        background: var(--bg-page); color: var(--text-primary); outline: none;
    }
    .flow-step-form input:focus, .flow-step-form textarea:focus { border-color: var(--accent); }
    .flow-step-form textarea { resize: vertical; min-height: 40px; }
    .flow-step-form-btns { display: flex; gap: 8px; }

    /* 操作渠道标签 */
    .channel-badge {
        display: inline-flex; align-items: center; padding: 1px 7px;
        border-radius: 8px; font-size: 10px; font-weight: 600; white-space: nowrap;
    }
    .channel-badge--pc  { background: #ede9fe; color: #6d28d9; }
    .channel-badge--pad { background: #dbeafe; color: #1d4ed8; }
    .channel-badge--mid { background: #d1fae5; color: #065f46; }

    /* 步骤列表视图 */
    .flow-table-wrap { flex: 1; overflow: auto; padding: 16px 20px; }
    .step-tbl { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 900px; }
    .step-tbl th {
        background: #f8fafc; padding: 9px 12px; text-align: left; font-weight: 700;
        color: #475569; font-size: 11px; letter-spacing: .04em;
        border-bottom: 2px solid #e2e8f0; white-space: nowrap; position: sticky; top: 0; z-index: 1;
    }
    .step-tbl td { padding: 9px 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .step-tbl tbody tr:hover { background: #f8fafc; }
    .step-tbl .lv1-row { background: #f0f7ff; }
    .step-tbl .lv2-row td:first-child { padding-left: 28px; }
    .step-tbl .lv3-row td:first-child { padding-left: 52px; }
    .step-name-cell { font-weight: 600; color: #1e293b; display: flex; align-items: center; gap: 6px; }
    .step-name-cell .type-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .lv-badge { padding: 1px 7px; border-radius: 6px; font-size: 10px; font-weight: 700; }
    .lv1 { background: #007aff; color: #fff; }
    .lv2 { background: #ff9500; color: #fff; }
    .lv3 { background: #34c759; color: #fff; }
    .tbl-view-btn { padding: 3px 8px; font-size: 11px; border: 1px solid #e2e8f0; border-radius: 6px; background: #fff; cursor: pointer; color: #3b82f6; transition: all .15s; }
    .tbl-view-btn:hover { background: #eff6ff; border-color: #93c5fd; }

    /* 视图切换 Tab */
    .view-tab-group { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .view-tab { padding: 5px 14px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--text-muted); transition: all .15s; }
    .view-tab.active { background: var(--accent); color: #fff; }
    .view-tab:not(.active):hover { background: var(--accent-light); color: var(--accent); }

    /* 通用 Modal（复用自数据标准） */
    .ds-modal { display: none; position: fixed; inset: 0; z-index: 1000; }
    .ds-modal--open { display: flex !important; align-items: center; justify-content: center; }
    .ds-modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
    .ds-modal-content {
        position: relative; background: var(--bg-card); border-radius: 14px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.2); max-height: 90vh;
        display: flex; flex-direction: column; z-index: 1; width: 600px;
    }
    .ds-modal-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 20px; border-bottom: 1px solid var(--border);
    }
    .ds-modal-header h3 { font-size: 16px; font-weight: 600; }
    .ds-modal-close {
        border: none; background: none; font-size: 22px; color: var(--text-muted);
        cursor: pointer; padding: 0 4px; line-height: 1;
    }
    .ds-modal-body { padding: 20px; overflow-y: auto; flex: 1; }
    .ds-modal-footer {
        display: flex; align-items: center; gap: 8px;
        padding: 12px 20px; border-top: 1px solid var(--border);
    }
    </style>
</head>
<body>
<div class="page page--wide" style="max-width:100%;padding:0;">
    <header class="header">
        <div class="header-inner">
            <div style="display:flex;align-items:center;justify-content:space-between;">
                <div style="display:flex;align-items:center;gap:12px;">
                    <a href="/" class="back-btn">←</a>
                    <div class="logo">
                        <span class="logo-icon">🗂️</span>
                        <span class="logo-text" id="page-title">一图一表</span>
                    </div>
                </div>
                <div style="display:flex;gap:8px;" id="header-actions">
                    <!-- 动态按钮 -->
                </div>
            </div>
        </div>
    </header>

    <div class="main" style="padding:12px 16px;flex:1;display:flex;flex-direction:column;">
        <!-- 视图 1: 产品列表 -->
        <div id="view-product-list" class="prod-layout">
            <div class="prod-header">
                <input type="text" class="prod-search" id="prodSearch" placeholder="搜索产品…">
                <button class="btn-primary" id="btn-add-product">＋ 新增产品</button>
            </div>
            <div class="prod-table-wrap">
                <table class="prod-table" id="prodTable">
                    <thead>
                        <tr>
                            <th>产品ID</th><th>产品名称</th><th>产品描述</th>
                            <th>产品经理</th><th>业务对接人</th><th>主管业务部门</th><th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div id="prod-empty" class="prod-empty">暂无产品，点击"新增产品"添加</div>
        </div>

        <!-- 视图 2: 流程图编辑 -->
        <div id="view-flow-editor" style="display:none;">
            <div style="margin-bottom:8px;">
                <button class="btn-secondary" id="btn-back-to-list">← 返回产品列表</button>
                <span id="flow-product-name" style="margin-left:12px;font-weight:600;font-size:14px;"></span>
            </div>
            <div class="flow-layout">
                <div class="flow-steps-panel">
                    <input type="text" class="flow-title-input" id="flow-title" placeholder="流程图名称…">
                    <div id="steps-container"></div>
                    <button class="btn-secondary" id="btn-add-step" style="width:100%;">＋ 添加步骤</button>
                </div>
                <div class="flow-svg-panel">
                    <div class="flow-svg-toolbar">
                        <div class="view-tab-group">
                            <button class="view-tab active" id="tab-chart" onclick="switchRightView('chart')">📊 流程图</button>
                            <button class="view-tab" id="tab-table" onclick="switchRightView('table')">📋 列表</button>
                        </div>
                        <button class="btn-secondary" id="btn-changelog" onclick="openChangelogModal()" style="margin-left:auto;">📋 变更日志</button>
                        <button class="btn-primary" id="btn-save-flow">保存</button>
                    </div>
                    <div class="flow-svg-wrap" id="right-chart-panel">
                        <svg id="flow-svg" viewBox="0 0 700 400" width="700" height="400"></svg>
                    </div>
                    <div class="flow-table-wrap" id="right-table-panel" style="display:none;">
                        <div style="display:flex;align-items:center;justify-content:flex-end;margin-bottom:10px;">
                            <button id="btn-export-excel" onclick="exportStepsExcel()"
                                style="display:flex;align-items:center;gap:6px;padding:6px 14px;background:#16a34a;border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;">
                                📥 导出 Excel
                            </button>
                        </div>
                        <table class="step-tbl" id="step-table">
                            <thead>
                                <tr>
                                    <th>编号</th><th>步骤名称</th><th>步骤层级</th><th>操作角色</th>
                                    <th>操作渠道</th><th>上级步骤</th><th>前序步骤</th>
                                    <th>后序步骤</th><th>关联规则/接口</th>
                                </tr>
                            </thead>
                            <tbody id="step-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer class="footer"><span>程钰的百宝箱 · 本地版</span></footer>
</div>

<!-- Modal: 产品编辑 -->
<div class="ds-modal" id="prodModal">
    <div class="ds-modal-backdrop"></div>
    <div class="ds-modal-content ds-modal--lg">
        <div class="ds-modal-header">
            <h3 id="prodModalTitle">新增产品</h3>
            <button class="ds-modal-close" data-close="prodModal">×</button>
        </div>
        <div class="ds-modal-body">
            <input type="hidden" id="prodEditId">
            <div class="prod-form-grid">
                <div class="prod-form-group">
                    <label>产品ID *</label>
                    <input type="text" id="prodId" placeholder="如：PROD_001">
                </div>
                <div class="prod-form-group">
                    <label>产品名称 *</label>
                    <input type="text" id="prodName" placeholder="如：信贷审批系统">
                </div>
                <div class="prod-form-group full">
                    <label>产品描述</label>
                    <textarea id="prodDesc" rows="2" placeholder="产品功能描述"></textarea>
                </div>
                <div class="prod-form-group">
                    <label>产品经理</label>
                    <input type="text" id="prodManager" placeholder="如：张三">
                </div>
                <div class="prod-form-group">
                    <label>业务对接人</label>
                    <input type="text" id="prodBizContact" placeholder="如：李四">
                </div>
                <div class="prod-form-group full">
                    <label>主管业务部门</label>
                    <input type="text" id="prodBizDept" placeholder="如：信贷管理部">
                </div>
            </div>
        </div>
        <div class="ds-modal-footer">
            <button class="btn-secondary" data-close="prodModal">取消</button>
            <button class="btn-primary" id="btnSaveProd">保存</button>
        </div>
    </div>
</div>

<!-- Modal: 关联规则/接口详情 -->
<div id="linkedDetailModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:14px;width:560px;max-width:95vw;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.25);overflow:hidden;">
        <div style="display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid #e2e8f0;">
            <h3 id="linkedDetailTitle" style="flex:1;font-size:15px;font-weight:700;color:#1e293b;"></h3>
            <button onclick="$('#linkedDetailModal').style.display='none'" style="border:none;background:none;font-size:20px;color:#94a3b8;cursor:pointer;">×</button>
        </div>
        <div style="padding:14px 20px;flex:1;overflow-y:auto;">
            <div id="linkedDetailDesc" style="font-size:13px;color:#64748b;margin-bottom:14px;"></div>
            <div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:6px;letter-spacing:.04em;">📥 输入字段</div>
            <div id="linkedDetailInput" style="margin-bottom:16px;"></div>
            <div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:6px;letter-spacing:.04em;">📤 输出字段</div>
            <div id="linkedDetailOutput"></div>
        </div>
    </div>
</div>

<!-- Modal: 变更日志 -->
<div id="changelogModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:14px;width:480px;max-width:95vw;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.25);overflow:hidden;">
        <div style="display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid #e2e8f0;">
            <h3 style="flex:1;font-size:15px;font-weight:700;color:#1e293b;">📋 变更日志</h3>
            <button onclick="$('#changelogModal').style.display='none'" style="border:none;background:none;font-size:20px;color:#94a3b8;cursor:pointer;">×</button>
        </div>
        <div style="padding:14px 20px;flex:1;overflow-y:auto;">
            <div id="changelogList"></div>
        </div>
        <div style="padding:12px 20px;border-top:1px solid #e2e8f0;display:flex;gap:8px;">
            <input id="changelogNewDesc" type="text" placeholder="手动记录变更说明…" style="flex:1;padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none;">
            <button onclick="manualAddChangelog()" style="padding:7px 16px;background:#4f46e5;border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;">记录</button>
        </div>
    </div>
</div>

<script>
// ── 状态 ──────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let products = [];
let currentProductId = null;
let steps = [];
let nextStepId = 1;
let cachedRules = [];
let cachedInterfaces = [];
let currentRightView = 'chart'; // 'chart' | 'table'

const CHANNEL_OPTIONS = ['PC', 'PAD', '中台'];
const CHANNEL_CLASS = { 'PC': 'channel-badge--pc', 'PAD': 'channel-badge--pad', '中台': 'channel-badge--mid' };

function switchRightView(view) {
    currentRightView = view;
    $('#right-chart-panel').style.display = view === 'chart' ? 'block' : 'none';
    $('#right-table-panel').style.display  = view === 'table' ? 'block' : 'none';
    $('#tab-chart').classList.toggle('active', view === 'chart');
    $('#tab-table').classList.toggle('active', view === 'table');
    if (view === 'table') renderStepTable();
}

// ── 步骤列表视图渲染 ──────────────────────────────────────
function renderStepTable() {
    const tbody = $('#step-table-body');
    if (!tbody) return;

    const codes = computeStepCodes(steps);

    // 为每个步骤计算前序/后序（同级相对顺序）
    const sameLevelSteps = {};
    steps.forEach(s => {
        const lv = s.level || 1;
        if (!sameLevelSteps[lv]) sameLevelSteps[lv] = [];
        sameLevelSteps[lv].push(s);
    });

    const rows = steps.map(s => {
        const lv = s.level || 1;
        const lvPeers = sameLevelSteps[lv] || [];
        const peerIdx = lvPeers.indexOf(s);
        const prevStep = peerIdx > 0 ? lvPeers[peerIdx - 1] : null;
        const nextStep = peerIdx < lvPeers.length - 1 ? lvPeers[peerIdx + 1] : null;
        const parentStep = s.parent_id ? steps.find(x => x.id === s.parent_id) : null;
        const stepType = s.step_type || '步骤';
        const hasLinked = (stepType === '规则' || stepType === '接口') && s.linked_id;

        const channels = Array.isArray(s.channels) ? s.channels : [];
        const chBadges = channels.map(c =>
            `<span class="channel-badge ${CHANNEL_CLASS[c] || ''}">${esc(c)}</span>`
        ).join(' ');

        const typeDotColor = stepType === '规则' ? '#f59e0b' : stepType === '接口' ? '#3b82f6' : 'transparent';
        const lvClass = `lv${lv}-row`;

        const code = codes[s.id] || '';
        return `<tr class="${lvClass}">
            <td style="font-family:monospace;font-size:11px;color:#64748b;white-space:nowrap;font-weight:600;">${esc(code)}</td>
            <td>
                <div class="step-name-cell">
                    ${stepType !== '步骤' ? `<span class="type-dot" style="background:${typeDotColor}"></span>` : ''}
                    <span>${esc(s.name)}</span>
                </div>
            </td>
            <td><span class="lv-badge lv${lv}">L${lv}</span></td>
            <td>${s.role ? `<span style="color:#7c3aed;font-size:12px;">👤 ${esc(s.role)}</span>` : '<span style="color:#94a3b8;">—</span>'}</td>
            <td>${chBadges || '<span style="color:#94a3b8;">—</span>'}</td>
            <td style="color:#475569;">${parentStep ? esc(parentStep.name) : '<span style="color:#94a3b8;">—</span>'}</td>
            <td style="color:#475569;">${prevStep ? esc(prevStep.name) : '<span style="color:#94a3b8;">—</span>'}</td>
            <td style="color:#475569;">${nextStep ? esc(nextStep.name) : '<span style="color:#94a3b8;">—</span>'}</td>
            <td>
                ${hasLinked
                    ? `<span style="font-size:12px;color:${stepType==='规则'?'#92400e':'#1e40af'};">🔗 ${esc(s.linked_name || s.linked_id)}</span>
                       <button class="tbl-view-btn" data-sid="${s.id}" style="margin-left:6px;">查看</button>`
                    : `<span style="color:#94a3b8;">—</span>`}
            </td>
        </tr>`;
    });

    tbody.innerHTML = rows.join('');

    // 绑定「查看」按钮
    tbody.querySelectorAll('.tbl-view-btn').forEach(btn => {
        const sid = parseInt(btn.dataset.sid);
        const step = steps.find(x => x.id === sid);
        if (step) btn.addEventListener('click', () => showLinkedDetail(step));
    });
}

// ── 步骤编号计算 ──────────────────────────────────────────
function computeStepCodes(steps) {
    const codes = {};
    const pad = n => String(n).padStart(4, '0');

    // L1：按数组顺序编号
    let l1i = 0;
    steps.forEach(s => {
        if ((s.level || 1) === 1) codes[s.id] = `P-${pad(++l1i)}`;
    });

    // L2：每个 L1 父节点下独立计数
    const l2cnt = {};
    steps.forEach(s => {
        if ((s.level || 1) !== 2) return;
        const pid = s.parent_id;
        l2cnt[pid] = (l2cnt[pid] || 0) + 1;
        codes[s.id] = `${codes[pid] || 'P-0000'}-${pad(l2cnt[pid])}`;
    });

    // L3：每个 L2 父节点下独立计数
    const l3cnt = {};
    steps.forEach(s => {
        if ((s.level || 1) !== 3) return;
        const pid = s.parent_id;
        l3cnt[pid] = (l3cnt[pid] || 0) + 1;
        codes[s.id] = `${codes[pid] || 'P-0000-0000'}-${pad(l3cnt[pid])}`;
    });

    return codes;
}

function showLinkedDetail(step) {
    const list = step.step_type === '规则' ? cachedRules : cachedInterfaces;
    const item = list.find(x => x.id == step.linked_id);
    if (!item) { alert('未找到关联' + (step.step_type||'') + '，请先在数据标准中维护。'); return; }
    let input_fields = [], output_fields = [];
    try { input_fields = JSON.parse(item.input_json || '[]'); } catch(e) {}
    try { output_fields = JSON.parse(item.output_json || '[]'); } catch(e) {}
    const renderFields = (fields) => {
        if (!fields.length) return '<div style="color:#94a3b8;font-size:12px;">（无字段）</div>';
        return `<table style="width:100%;border-collapse:collapse;font-size:12px;">
            <thead><tr style="background:#f1f5f9;"><th style="padding:4px 8px;text-align:left;border:1px solid #e2e8f0;">字段名</th><th style="padding:4px 8px;text-align:left;border:1px solid #e2e8f0;">类型</th><th style="padding:4px 8px;text-align:left;border:1px solid #e2e8f0;">说明</th></tr></thead>
            <tbody>${fields.map(f=>`<tr><td style="padding:4px 8px;border:1px solid #e2e8f0;">${esc(f.name||f.field_name||'')}</td><td style="padding:4px 8px;border:1px solid #e2e8f0;">${esc(f.type||f.data_type||'')}</td><td style="padding:4px 8px;border:1px solid #e2e8f0;">${esc(f.desc||f.description||'')}</td></tr>`).join('')}</tbody>
        </table>`;
    };
    $('#linkedDetailTitle').textContent = `${step.step_type}：${item.name}`;
    $('#linkedDetailDesc').textContent = item.description || '';
    $('#linkedDetailInput').innerHTML = renderFields(input_fields);
    $('#linkedDetailOutput').innerHTML = renderFields(output_fields);
    $('#linkedDetailModal').style.display = 'flex';
}

    const editId = $('#prodEditId').value;

    if (!productId || !productName) { alert('请填写产品ID和名称'); return; }

            });
        } else {

// ── 步骤维护 ──────────────────────────────────────────────
function renderSteps() {
    const container = $('#steps-container');
    container.replaceChildren();
    const codes = computeStepCodes(steps);
    steps.forEach((s, i) => {
        const level = s.level || 1;
        const stepType = s.step_type || '步骤';
        const code = codes[s.id] || '';
        const typeBadgeHtml = stepType !== '步骤'
            ? `<span style="font-size:10px;padding:1px 6px;border-radius:4px;background:${stepType === '规则' ? '#fef3c7' : '#dbeafe'};color:${stepType === '规则' ? '#92400e' : '#1e40af'};">${stepType}</span>`
            : '';
        const item = document.createElement('div');
        item.className = 'flow-step-item';
        item.draggable = true;
        item.dataset.stepId = s.id;
        item.dataset.level = level;
        item.innerHTML = `
            <div class="flow-step-body">
                <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;">
                    <span style="font-family:monospace;font-size:10px;font-weight:700;color:#94a3b8;letter-spacing:.02em;background:#f1f5f9;padding:1px 5px;border-radius:4px;">${esc(code)}</span>
                    <span class="flow-step-name" style="margin-bottom:0;">${esc(s.name)}</span>
                </div>
                <div style="display:flex;align-items:center;gap:5px;margin-top:2px;">
                    <span class="flow-step-level-badge" data-level="${level}">L${level}</span>
                    ${typeBadgeHtml}
                </div>
                ${s.role ? '<div class="flow-step-desc" style="color:#7c3aed;font-weight:500;margin-top:2px;">👤 ' + esc(s.role) + '</div>' : ''}
                ${Array.isArray(s.channels) && s.channels.length ? '<div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:3px;">' + s.channels.map(c => '<span class="channel-badge ' + (CHANNEL_CLASS[c]||'') + '">' + esc(c) + '</span>').join('') + '</div>' : ''}
                ${s.desc ? '<div class="flow-step-desc">' + esc(s.desc) + '</div>' : ''}
                ${(s.step_type === '规则' || s.step_type === '接口') && s.linked_name ? '<div class="flow-step-desc" style="color:' + (s.step_type==='规则'?'#92400e':'#1e40af') + ';margin-top:2px;">🔗 ' + esc(s.linked_name) + ' <span class="step-view-link" data-step-id="' + s.id + '" style="cursor:pointer;text-decoration:underline;font-size:11px;">查看</span></div>' : ''}
            </div>
            <div class="flow-step-actions">
                <button class="flow-step-btn btn-add-substep" title="添加子步骤">➕</button>
                <button class="flow-step-btn btn-edit-step" title="编辑">✏️</button>
                <button class="flow-step-btn flow-step-btn--danger btn-del-step" title="删除">🗑️</button>
            </div>
        `;
        // 拖拽排序
        item.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', s.id); item.classList.add('dragging'); });
        item.addEventListener('dragend', () => item.classList.remove('dragging'));
        item.addEventListener('dragover', e => { e.preventDefault(); item.classList.add('drag-over'); });
        item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
        item.addEventListener('drop', e => {
            e.preventDefault();
            item.classList.remove('drag-over');
            const fromId = parseInt(e.dataTransfer.getData('text/plain'));
            const toId = s.id;
            if (fromId !== toId) {
                const fromIdx = steps.findIndex(x => x.id === fromId);
                const toIdx = steps.findIndex(x => x.id === toId);
                const [moved] = steps.splice(fromIdx, 1);
                steps.splice(toIdx, 0, moved);
                renderSteps();
            }
        });
        item.querySelector('.btn-add-substep').addEventListener('click', () => addSubStep(s));
        item.querySelector('.btn-edit-step').addEventListener('click', () => editStep(s));
        item.querySelector('.btn-del-step').addEventListener('click', () => {
            steps = steps.filter(x => x.id !== s.id);
            renderSteps();
        });
        const viewLink = item.querySelector('.step-view-link');
        if (viewLink) viewLink.addEventListener('click', (e) => { e.stopPropagation(); showLinkedDetail(s); });
        container.appendChild(item);
    });
    renderFlowchart();
    if (currentRightView === 'table') renderStepTable();
}

function addSubStep(parentStep) {
    const container = $('#steps-container');
    const existing = container.querySelector('.flow-step-form');
    if (existing) existing.remove();

    const parentLevel = parentStep.level || 1;
    const childLevel = Math.min(parentLevel + 1, 3);

    // 步骤类型选项：L1只能是步骤，L2/L3可以选择规则/接口
    const stepTypeOptions = childLevel === 1
        ? '<option value="步骤">步骤</option>'
        : '<option value="步骤" selected>步骤</option><option value="规则">规则</option><option value="接口">接口</option>';

    const form = document.createElement('div');
    form.className = 'flow-step-form';
    form.style.marginLeft = (childLevel - 1) * 24 + 'px';
    form.innerHTML = `
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">作为「${esc(parentStep.name)}」的子步骤（L${childLevel}）</div>
        <input type="text" class="step-name-input" placeholder="步骤名称 *">
        <input type="text" class="step-role-input" placeholder="操作角色（可选）">
        <textarea class="step-desc-input" placeholder="步骤描述（可选）"></textarea>
        <div style="display:flex;flex-direction:column;gap:6px;">
            <div style="display:flex;align-items:center;gap:8px;">
                <label style="font-size:12px;color:var(--text-muted);white-space:nowrap;min-width:56px;">步骤层级：</label>
                <span style="font-size:12px;font-weight:600;color:${childLevel===2?'#e06c00':'#18a94a'};">L${childLevel}（${childLevel===2?'二级':'三级'}步骤）</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
                <label style="font-size:12px;color:var(--text-muted);white-space:nowrap;min-width:56px;">步骤类型：</label>
                <select class="step-type-select" style="flex:1;">
                    ${stepTypeOptions}
                </select>
            </div>
            ${channelCheckboxesHtml()}
        </div>
        <div class="step-linked-row"></div>
        <div class="flow-step-form-btns">
            <button class="btn-primary btn-save-step">添加</button>
            <button class="btn-secondary btn-cancel-step">取消</button>
        </div>
    `;

    // 在父步骤后面插入表单
    const parentItem = container.querySelector(`[data-step-id="${parentStep.id}"]`);
    if (parentItem) {
        container.insertBefore(form, parentItem.nextSibling);
    } else {
        container.appendChild(form);
    }
    form.querySelector('.step-name-input').focus();

    // setup linked selector when type changes
    const subTypeSelect = form.querySelector('.step-type-select');
    setupLinkedSelectorInForm(form, subTypeSelect.value, null);
    subTypeSelect.addEventListener('change', () => setupLinkedSelectorInForm(form, subTypeSelect.value, null));

    const parentIdx = steps.findIndex(x => x.id === parentStep.id);
    form.querySelector('.btn-save-step').addEventListener('click', () => {
        const name = form.querySelector('.step-name-input').value.trim();
        const role = form.querySelector('.step-role-input').value.trim();
        const desc = form.querySelector('.step-desc-input').value.trim();
        const stepType = form.querySelector('.step-type-select').value;
        const linkedSel = form.querySelector('.step-linked-select');
        const linkedId = linkedSel ? linkedSel.value : '';
        const linkedList = stepType === '规则' ? cachedRules : cachedInterfaces;
        const linkedItem = linkedId ? linkedList.find(x => x.id == linkedId) : null;
        if (!name) { alert('请填写步骤名称'); return; }
        const channels = getCheckedChannels(form);
        const newStep = { id: nextStepId++, name, role, desc, channels, level: childLevel, parent_id: parentStep.id, step_type: stepType,
            linked_id: linkedId || null, linked_name: linkedItem ? linkedItem.name : null };
        steps.splice(parentIdx + 1, 0, newStep);
        form.remove();
        renderSteps();
    });
    form.querySelector('.btn-cancel-step').addEventListener('click', () => form.remove());
}

function editStep(step) {
    const container = $('#steps-container');
    const existing = container.querySelector('.flow-step-form');
    if (existing) existing.remove();

    const level = step.level || 1;

// ── 交互式流程图渲染 ──────────────────────────────────────
let expandedNodes = new Set(); // 记录哪些节点展开了

// ── XMind 布局常量 ────────────────────────────────────────
const XM = {
    l1X: 40, l1W: 190, l1H: 72,
    l2W: 155, l2H: 36, l2Gap: 10, l2Branch: 60,
    l3W: 138, l3H: 30, l3Gap: 8,  l3Branch: 45,
    nodeGap: 30, vertPad: 14
};

// 计算 L1 步骤占用的槽位高度（需要容纳所有子节点）
function getSlotH(step) {
    if (!expandedNodes.has(step.id)) return XM.l1H;
    const l2s = steps.filter(s => s.parent_id === step.id);
    if (!l2s.length) return XM.l1H;
    let blockH = l2s.length * XM.l2H + (l2s.length - 1) * XM.l2Gap;
    // 检查展开的 L2 是否有 L3 子节点
    l2s.forEach(l2 => {
        if (expandedNodes.has(l2.id)) {
            const l3s = steps.filter(s => s.parent_id === l2.id);
            if (l3s.length > 0) {
                const l3H = l3s.length * XM.l3H + (l3s.length - 1) * XM.l3Gap;
                // L3 块需要以 L2 为中心展开，计算最大需求高度
                const l2Idx = l2s.indexOf(l2);
                const l2CenterOffset = l2Idx * (XM.l2H + XM.l2Gap) + XM.l2H / 2;
                const l3Top = l2CenterOffset - l3H / 2;
                const l3Bot = l2CenterOffset + l3H / 2;
                blockH = Math.max(blockH, l3Bot + (blockH - l2CenterOffset));
                if (l3Top < 0) blockH += Math.abs(l3Top);
            }
        }
    });
    return Math.max(XM.l1H, blockH) + XM.vertPad * 2;
}

function renderFlowchart() {
    const levelColors   = { 1: '#007aff', 2: '#e06c00', 3: '#18a94a' };
    const levelBgColors = { 1: '#eef4ff', 2: '#fff4e6', 3: '#edfbf1' };

    // 获取 L1 步骤
    let l1Steps = steps.filter(s => s.level === 1);
    if (steps.length === 0) {
        const svgEl = $('#flow-svg');
        svgEl.setAttribute('viewBox', '0 0 400 200');
        svgEl.innerHTML = '';
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', '200'); text.setAttribute('y', '100');
        text.setAttribute('text-anchor', 'middle'); text.setAttribute('font-size', '16');
        text.setAttribute('fill', '#8e8e93');
        text.textContent = '添加步骤后自动生成流程图';
        svgEl.appendChild(text);
        return;
    }
    if (l1Steps.length === 0) {
        steps.forEach(s => s.level = 1);
        l1Steps = steps.filter(s => s.level === 1);
    }

    // 计算总尺寸
    const slotHeights = l1Steps.map(s => getSlotH(s));
    const totalH = 60 + (XM.l1H + XM.nodeGap) + slotHeights.reduce((a, h) => a + h + XM.nodeGap, 0) + XM.l1H + 40;
    const totalW = XM.l1X + XM.l1W + XM.l2Branch + XM.l2W + XM.l3Branch + XM.l3W + 40;

    const svgEl = $('#flow-svg');
    svgEl.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);
    svgEl.setAttribute('width', String(totalW));
    svgEl.setAttribute('height', String(totalH));
    svgEl.style.width = totalW + 'px';
    svgEl.style.height = totalH + 'px';
    svgEl.style.minWidth = totalW + 'px';
    svgEl.style.minHeight = totalH + 'px';
    svgEl.innerHTML = '';

    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    defs.innerHTML = `<marker id="arrow3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8e8e93"/>
    </marker>`;
    svgEl.appendChild(defs);

    const spineX = XM.l1X + XM.l1W / 2; // 主轴 X（居中于 L1 节点）

    const stepCodes = computeStepCodes(steps);

    // ── 开始节点 ──
    let curY = 30;
    const startNode = { id: 'start', name: '开始', level: 1, parent_id: null, step_type: '步骤' };
    renderNode(svgEl, startNode, XM.l1X, curY, XM.l1W, XM.l1H, levelColors, levelBgColors, '▶', false, false, [], 0, 0, 0, 0, 0, defs, null);
    curY += XM.l1H + XM.nodeGap;

    // ── L1 步骤 ──
    l1Steps.forEach((step, i) => {
        const slotH = slotHeights[i];
        const nodeY = curY + (slotH - XM.l1H) / 2;
        const nodeCY = nodeY + XM.l1H / 2;

        const children = steps.filter(s => s.parent_id === step.id);
        const hasChildren = children.length > 0;
        const isExpanded = expandedNodes.has(step.id);

        const fromY = curY - XM.nodeGap;
        const toY = nodeY;
        const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        arrow.setAttribute('x1', spineX); arrow.setAttribute('y1', fromY);
        arrow.setAttribute('x2', spineX); arrow.setAttribute('y2', toY);
        arrow.setAttribute('stroke', '#b0b8c8'); arrow.setAttribute('stroke-width', '2');
        arrow.setAttribute('marker-end', 'url(#arrow3)');
        svgEl.appendChild(arrow);

        renderNode(svgEl, step, XM.l1X, nodeY, XM.l1W, XM.l1H, levelColors, levelBgColors, i + 1, hasChildren, isExpanded, children, 0, 0, 0, 0, 0, defs, stepCodes[step.id] || null);

        if (isExpanded && hasChildren) {
            renderChildrenMindMap(svgEl, children, XM.l1X, nodeCY, XM.l1W, 2, levelColors, levelBgColors, stepCodes);
        }

        curY += slotH + XM.nodeGap;
    });

    // ── 结束节点 ──
    const endNode = { id: 'end', name: '结束', level: 1, parent_id: null, step_type: '步骤' };
    const endArrow = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    endArrow.setAttribute('x1', spineX); endArrow.setAttribute('y1', curY - XM.nodeGap);
    endArrow.setAttribute('x2', spineX); endArrow.setAttribute('y2', curY);
    endArrow.setAttribute('stroke', '#b0b8c8'); endArrow.setAttribute('stroke-width', '2');
    endArrow.setAttribute('marker-end', 'url(#arrow3)');
    svgEl.appendChild(endArrow);
    renderNode(svgEl, endNode, XM.l1X, curY, XM.l1W, XM.l1H, levelColors, levelBgColors, '⏹', false, false, [], 0, 0, 0, 0, 0, defs, null);
}

// ── XMind 思维导图：子节点横向展开（贝塞尔曲线连接） ────
function renderChildrenMindMap(svg, children, parentX, parentCY, parentW, level, levelColors, levelBgColors, stepCodes) {
    const cW = level === 2 ? XM.l2W : XM.l3W;
    const cH = level === 2 ? XM.l2H : XM.l3H;
    const cGap = level === 2 ? XM.l2Gap : XM.l3Gap;
    const branchGap = level === 2 ? XM.l2Branch : XM.l3Branch;
    const childX = parentX + parentW + branchGap;
    const color = levelColors[level] || '#e06c00';

    const totalChildH = children.length * cH + (children.length - 1) * cGap;
    const startY = parentCY - totalChildH / 2;

    children.forEach((child, i) => {
        const cy = startY + i * (cH + cGap);
        const childCY = cy + cH / 2;
        const midX = parentX + parentW + branchGap * 0.55;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${parentX + parentW} ${parentCY} C ${midX} ${parentCY}, ${midX} ${childCY}, ${childX} ${childCY}`);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', color);
        path.setAttribute('stroke-width', level === 2 ? '2' : '1.5');
        path.setAttribute('opacity', '0.5');
        svg.appendChild(path);

        const grandChildren = steps.filter(s => s.parent_id === child.id);
        const hasGrand = grandChildren.length > 0;
        const grandExpanded = expandedNodes.has(child.id);

        renderMindNode(svg, child, childX, cy, cW, cH, color, levelBgColors[level] || '#fff4e6', i + 1, hasGrand, grandExpanded, stepCodes ? stepCodes[child.id] : null);

        if (grandExpanded && hasGrand && level < 3) {
            renderChildrenMindMap(svg, grandChildren, childX, childCY, cW, level + 1, levelColors, levelBgColors, stepCodes);
        }
    });
}

// ── XMind 子节点样式：圆角矩形 + 底部强调线 ─────────────
function renderMindNode(svg, step, x, y, w, h, color, bgColor, order, hasChildren, isExpanded, stepCode) {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `translate(${x}, ${y})`);

    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('width', w); rect.setAttribute('height', h);
    rect.setAttribute('rx', '7');
    rect.setAttribute('fill', bgColor);
    rect.setAttribute('stroke', color); rect.setAttribute('stroke-width', '0.8');
    rect.setAttribute('stroke-opacity', '0.4');
    g.appendChild(rect);

    // 底部强调线（XMind 标志性风格）
    const underline = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    underline.setAttribute('x', '8'); underline.setAttribute('y', h - 3);
    underline.setAttribute('width', w - 16); underline.setAttribute('height', '3');
    underline.setAttribute('rx', '1.5'); underline.setAttribute('fill', color);
    g.appendChild(underline);

    // 序号小圆
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', '12'); dot.setAttribute('cy', h / 2 - 1);
    dot.setAttribute('r', '7'); dot.setAttribute('fill', color);
    g.appendChild(dot);
    const numT = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    numT.setAttribute('x', '12'); numT.setAttribute('y', h / 2 - 1);
    numT.setAttribute('dominant-baseline', 'central'); numT.setAttribute('text-anchor', 'middle');
    numT.setAttribute('font-size', '9'); numT.setAttribute('fill', '#fff');
    numT.setAttribute('font-weight', '700');
    numT.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif');
    numT.textContent = order;
    g.appendChild(numT);

    // 步骤名称
    const maxLen = hasChildren ? 10 : 13;
    const nameTxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    nameTxt.setAttribute('x', '24'); nameTxt.setAttribute('y', h / 2 - 1);
    nameTxt.setAttribute('dominant-baseline', 'central');
    nameTxt.setAttribute('font-size', '11'); nameTxt.setAttribute('fill', '#1a1a2e');
    nameTxt.setAttribute('font-weight', '500');
    nameTxt.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif');
    nameTxt.textContent = step.name.length > maxLen ? step.name.slice(0, maxLen) + '…' : step.name;
    g.appendChild(nameTxt);

    // 类型标签（规则/接口）
    const stepType = step.step_type || '步骤';
    if (stepType !== '步骤') {
        const tagColors = { '规则': '#f59e0b', '接口': '#3b82f6' };
        const tc = tagColors[stepType] || color;
        const tagW = 28, tagH2 = 14, tagX = w - tagW - (hasChildren ? 20 : 6), tagY = (h - tagH2) / 2;
        const tagRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        tagRect.setAttribute('x', tagX); tagRect.setAttribute('y', tagY);
        tagRect.setAttribute('width', tagW); tagRect.setAttribute('height', tagH2);
        tagRect.setAttribute('rx', '7'); tagRect.setAttribute('fill', tc); tagRect.setAttribute('opacity', '0.18');
        g.appendChild(tagRect);
        const tagTxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        tagTxt.setAttribute('x', tagX + tagW / 2); tagTxt.setAttribute('y', tagY + tagH2 / 2);
        tagTxt.setAttribute('dominant-baseline', 'central'); tagTxt.setAttribute('text-anchor', 'middle');
        tagTxt.setAttribute('font-size', '8'); tagTxt.setAttribute('fill', tc); tagTxt.setAttribute('font-weight', '700');
        tagTxt.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif');
        tagTxt.textContent = stepType;
        g.appendChild(tagTxt);
    }

    // 步骤编号（右下角小字）
    if (stepCode) {
        const codeT = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        codeT.setAttribute('x', String(w - (hasChildren ? 22 : 6)));
        codeT.setAttribute('y', String(h - 5));
        codeT.setAttribute('text-anchor', 'end');
        codeT.setAttribute('font-size', '7');
        codeT.setAttribute('fill', '#94a3b8');
        codeT.setAttribute('font-family', 'monospace,"Courier New"');
        codeT.textContent = stepCode;
        g.appendChild(codeT);
    }

    // 展开/收起按钮
    if (hasChildren) {
        const bx = w - 11, by = h / 2 - 1;
        const bc = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        bc.setAttribute('cx', bx); bc.setAttribute('cy', by);
        bc.setAttribute('r', '8'); bc.setAttribute('fill', '#fff');
        bc.setAttribute('stroke', color); bc.setAttribute('stroke-width', '1.2');
        bc.style.cursor = 'pointer';
        g.appendChild(bc);
        const bs = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        bs.setAttribute('x', bx); bs.setAttribute('y', by + 1);
        bs.setAttribute('dominant-baseline', 'central'); bs.setAttribute('text-anchor', 'middle');
        bs.setAttribute('font-size', '13'); bs.setAttribute('fill', color);
        bs.setAttribute('font-weight', '700'); bs.style.cursor = 'pointer';
        bs.textContent = isExpanded ? '−' : '+';
        g.appendChild(bs);
        [bc, bs].forEach(el => el.addEventListener('click', ev => {
            ev.stopPropagation();
            if (isExpanded) expandedNodes.delete(step.id); else expandedNodes.add(step.id);
            renderFlowchart();
        }));
    }

    svg.appendChild(g);
}

// ── 保留原函数名作为空壳（兼容旧调用）─────────────────────
function renderChildrenVertical(svg, parentId, children, parentX, startY, nodeW, nodeH, levelColors, levelBgColors, nodeGap, childOffsetY, parentCenterY, defs) {
    const CHILD_H = 44;
    const CHILD_GAP = 10;
    const INDENT = 22;           // 向右缩进量
    const BRACKET_X = parentX + 10; // 左侧括号线 X

    // ── 第一步：预先计算每个子节点的 Y 坐标 ─────────────
    const slots = [];
    let y = startY + 6;
    children.forEach((child, ci) => {
        const grandChildren = steps.filter(s => s.parent_id === child.id);
        const grandIsExpanded = expandedNodes.has(child.id);
        slots.push({ child, ci, y, grandChildren, grandIsExpanded });
        y += CHILD_H + CHILD_GAP;
        if (grandIsExpanded && grandChildren.length > 0) {
            y += grandChildren.length * (CHILD_H + CHILD_GAP) + 6;
        }
    });

    // ── 第二步：先画括号连线（在节点下层） ──────────────
    const firstMid = slots[0].y + CHILD_H / 2;
    const lastMid  = slots[slots.length - 1].y + CHILD_H / 2;
    const lvColor  = levelColors[children[0].level] || '#ff9500';

    // 竖向括号
    const vline = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    vline.setAttribute('x1', BRACKET_X); vline.setAttribute('y1', firstMid);
    vline.setAttribute('x2', BRACKET_X); vline.setAttribute('y2', lastMid);
    vline.setAttribute('stroke', lvColor); vline.setAttribute('stroke-width', '1.5');
    vline.setAttribute('opacity', '0.35');
    svg.appendChild(vline);

    // 每个子节点的水平臂
    slots.forEach(({ y: sy }) => {
        const arm = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        arm.setAttribute('x1', BRACKET_X); arm.setAttribute('y1', sy + CHILD_H / 2);
        arm.setAttribute('x2', parentX + INDENT); arm.setAttribute('y2', sy + CHILD_H / 2);
        arm.setAttribute('stroke', lvColor); arm.setAttribute('stroke-width', '1.5');
        arm.setAttribute('opacity', '0.35');
        svg.appendChild(arm);
    });

    // ── 第三步：渲染子节点卡片 ───────────────────────────
    let finalY = y;
    slots.forEach(({ child, ci, y: sy, grandChildren, grandIsExpanded }) => {
        renderChildCard(svg, child, parentX + INDENT, sy, nodeW - INDENT, CHILD_H, levelColors, levelBgColors, ci + 1, grandChildren.length > 0, grandIsExpanded, defs);

        if (grandIsExpanded && grandChildren.length > 0) {
            renderChildrenVertical(
                svg, child.id, grandChildren,
                parentX + INDENT, sy + CHILD_H + CHILD_GAP,
                nodeW - INDENT, CHILD_H,
                levelColors, levelBgColors,
                nodeGap, childOffsetY, sy + CHILD_H / 2, defs
            );
        }
    });

    return finalY;
}

// ── 子节点卡片样式渲染（L2/L3）────────────────────────────
function renderChildCard(svg, step, x, y, cardW, cardH, colors, bgColors, order, hasChildren, isExpanded, defs) {
    const color  = colors[step.level]   || colors[2];
    const bgColor = bgColors[step.level] || bgColors[2];
    const stepType = step.step_type || '步骤';
    const typeAccent = { '规则': '#f59e0b', '接口': '#3b82f6' };

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `translate(${x}, ${y})`);

    // 背景卡片（圆角矩形，细边框）
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('width', cardW); rect.setAttribute('height', cardH);
    rect.setAttribute('rx', '8');
    rect.setAttribute('fill', bgColor);
    rect.setAttribute('stroke', color); rect.setAttribute('stroke-width', '1');
    rect.setAttribute('opacity', '0.9');
    g.appendChild(rect);

    // 左侧色条（accent strip）
    const strip = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    strip.setAttribute('x', '0'); strip.setAttribute('y', '4');
    strip.setAttribute('width', '4'); strip.setAttribute('height', cardH - 8);
    strip.setAttribute('rx', '2'); strip.setAttribute('fill', color);
    g.appendChild(strip);

    // 序号圆形
    const badge = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    badge.setAttribute('cx', '18'); badge.setAttribute('cy', cardH / 2);
    badge.setAttribute('r', '9'); badge.setAttribute('fill', color);
    g.appendChild(badge);

    const badgeTxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    badgeTxt.setAttribute('x', '18'); badgeTxt.setAttribute('y', cardH / 2);
    badgeTxt.setAttribute('dominant-baseline', 'central'); badgeTxt.setAttribute('text-anchor', 'middle');
    badgeTxt.setAttribute('font-size', '9'); badgeTxt.setAttribute('fill', '#fff');
    badgeTxt.setAttribute('font-weight', '700');
    badgeTxt.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif');
    badgeTxt.textContent = order;
    g.appendChild(badgeTxt);

    // 步骤名称
    const hasDesc = !!step.desc;
    const nameY = hasDesc ? cardH / 2 - 7 : cardH / 2;
    const nameTxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    nameTxt.setAttribute('x', '32'); nameTxt.setAttribute('y', nameY);
    nameTxt.setAttribute('dominant-baseline', 'central');
    nameTxt.setAttribute('font-size', '11'); nameTxt.setAttribute('fill', '#1d1d1f');
    nameTxt.setAttribute('font-weight', '500');
    nameTxt.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif');
    const maxNameLen = stepType !== '步骤' ? 10 : 14;
    nameTxt.textContent = step.name.length > maxNameLen ? step.name.slice(0, maxNameLen) + '…' : step.name;
    g.appendChild(nameTxt);

    // 步骤描述（可选）
    if (hasDesc) {
        const descTxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        descTxt.setAttribute('x', '32'); descTxt.setAttribute('y', cardH / 2 + 7);
        descTxt.setAttribute('dominant-baseline', 'central');
        descTxt.setAttribute('font-size', '9'); descTxt.setAttribute('fill', '#8e8e93');
        descTxt.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif');
        const maxDescLen = 16;
        descTxt.textContent = step.desc.length > maxDescLen ? step.desc.slice(0, maxDescLen) + '…' : step.desc;
        g.appendChild(descTxt);
    }

    // 步骤类型标签（规则/接口）
    if (stepType !== '步骤') {
        const tagColor = typeAccent[stepType] || color;
        const tagX = cardW - 40;
        const tagRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        tagRect.setAttribute('x', tagX); tagRect.setAttribute('y', cardH / 2 - 8);
        tagRect.setAttribute('width', '32'); tagRect.setAttribute('height', '16');
        tagRect.setAttribute('rx', '8'); tagRect.setAttribute('fill', tagColor);
        tagRect.setAttribute('opacity', '0.15');
        g.appendChild(tagRect);
        const tagTxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        tagTxt.setAttribute('x', tagX + 16); tagTxt.setAttribute('y', cardH / 2);
        tagTxt.setAttribute('dominant-baseline', 'central'); tagTxt.setAttribute('text-anchor', 'middle');
        tagTxt.setAttribute('font-size', '8'); tagTxt.setAttribute('fill', tagColor);
        tagTxt.setAttribute('font-weight', '700');
        tagTxt.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif');
        tagTxt.textContent = stepType;
        g.appendChild(tagTxt);
    }

    // 展开/收起按钮（有子节点时）
    if (hasChildren) {
        const btnX = cardW - 10;
        const btnY = cardH / 2;
        const bg = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        bg.setAttribute('cx', btnX); bg.setAttribute('cy', btnY);
        bg.setAttribute('r', '9'); bg.setAttribute('fill', '#fff');
        bg.setAttribute('stroke', color); bg.setAttribute('stroke-width', '1.2');
        bg.style.cursor = 'pointer';
        g.appendChild(bg);
        const sym = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        sym.setAttribute('x', btnX); sym.setAttribute('y', btnY);
        sym.setAttribute('dominant-baseline', 'central'); sym.setAttribute('text-anchor', 'middle');
        sym.setAttribute('font-size', '13'); sym.setAttribute('fill', color);
        sym.setAttribute('font-weight', '700'); sym.style.cursor = 'pointer';
        sym.textContent = isExpanded ? '−' : '+';
        g.appendChild(sym);
        [bg, sym].forEach(el => el.addEventListener('click', ev => {
            ev.stopPropagation();
            if (isExpanded) expandedNodes.delete(step.id); else expandedNodes.add(step.id);
            renderFlowchart();
        }));
    }

    svg.appendChild(g);
}

function renderNode(svg, step, x, y, nodeW, nodeH, colors, bgColors, order, hasChildren, isExpanded, children, childOffsetX, childBaseY, childNodeW, childNodeH, childNodeGap, defs, stepCode) {
    const color = colors[step.level] || colors[1];
    const bgColor = bgColors[step.level] || bgColors[1];

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `translate(${x}, ${y})`);
    g.dataset.stepId = step.id;
    g.style.cursor = 'grab';

    // 拖拽排序（同层级）
    g.addEventListener('dragstart', ev => {
        ev.dataTransfer.setData('text/plain', step.id);
        g.style.opacity = '0.4';
    });
    g.addEventListener('dragend', () => { g.style.opacity = ''; });
    g.addEventListener('dragover', ev => { ev.preventDefault(); });
    g.addEventListener('drop', ev => {
        ev.preventDefault();
        const fromId = parseInt(ev.dataTransfer.getData('text/plain'));
        const toId = step.id;
        if (fromId !== toId) {
            const siblings = steps.filter(s => s.level === step.level);
            const fromIdx = siblings.findIndex(s => s.id === fromId);
            const toIdx = siblings.findIndex(s => s.id === toId);
            const [moved] = siblings.splice(fromIdx, 1);
            siblings.splice(toIdx, 0, moved);
            // 替换回 steps 中的对应位置
            let levelIdx = 0;
            for (let i = 0; i < steps.length; i++) {
                if (steps[i].level === step.level) {
                    steps[i] = siblings[levelIdx];
                    levelIdx++;
                }
            }
            renderSteps();
        }
    });
    g.draggable = true;

    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('width', nodeW); rect.setAttribute('height', nodeH);
    rect.setAttribute('rx', '10'); rect.setAttribute('fill', bgColor);
    rect.setAttribute('stroke', color); rect.setAttribute('stroke-width', step.level === 1 ? '2' : '1.5');
    g.appendChild(rect);

    // 序号（仅普通步骤显示，开始/结束节点不显示）
    if (typeof order === 'number') {
        const badge = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        badge.setAttribute('cx', '14'); badge.setAttribute('cy', '14');
        badge.setAttribute('r', '8'); badge.setAttribute('fill', color);
        g.appendChild(badge);

        const badgeText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        badgeText.setAttribute('x', '14'); badgeText.setAttribute('y', '14');
        badgeText.setAttribute('dominant-baseline', 'central'); badgeText.setAttribute('text-anchor', 'middle');
        badgeText.setAttribute('font-size', '9'); badgeText.setAttribute('fill', '#fff');
        badgeText.setAttribute('font-weight', '700');
        badgeText.textContent = order;
        g.appendChild(badgeText);
    }

    // L1 节点：name(y=20) + role(y=36) + desc(y=52)
    // 其他节点：name(y=20) + desc(y=36) / type badge(y=34)
    const isL1 = step.level === 1;
    const hasRole = isL1 && step.role;

    // 名称
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', '28'); text.setAttribute('y', '22');
    text.setAttribute('font-size', isL1 ? '12' : '11');
    text.setAttribute('fill', '#1d1d1f');
    text.setAttribute('font-weight', isL1 ? '600' : '400');
    text.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif');
    text.textContent = step.name.length > 13 ? step.name.slice(0, 13) + '…' : step.name;
    g.appendChild(text);

    // 操作角色（仅 L1）
    if (hasRole) {
        const roleText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        roleText.setAttribute('x', '28'); roleText.setAttribute('y', '38');
        roleText.setAttribute('font-size', '9'); roleText.setAttribute('fill', '#7c3aed');
        roleText.setAttribute('font-weight', '500');
        roleText.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif');
        const roleLabel = step.role.length > 14 ? step.role.slice(0, 14) + '…' : step.role;
        roleText.textContent = '\u25cf ' + roleLabel;
        g.appendChild(roleText);
    }

    // 描述
    if (step.desc) {
        const descY = hasRole ? '54' : '38';
        const descText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        descText.setAttribute('x', '28'); descText.setAttribute('y', descY);
        descText.setAttribute('font-size', '9'); descText.setAttribute('fill', '#8e8e93');
        descText.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif');
        descText.textContent = step.desc.length > 18 ? step.desc.slice(0, 18) + '…' : step.desc;
        g.appendChild(descText);
    }

    // 步骤类型标签（仅非步骤类型且非L1起止节点显示）
    const stepType = step.step_type || '步骤';
    if (typeof order === 'number' && stepType !== '步骤') {
        const typeColors = { '规则': { bg: '#fef3c7', stroke: '#f59e0b', fill: '#92400e' }, '接口': { bg: '#dbeafe', stroke: '#3b82f6', fill: '#1e40af' } };
        const tc = typeColors[stepType] || typeColors['步骤'];
        const typeY = hasRole ? '56' : '36';
        const typeTextY = parseInt(typeY) + 7;
        const typeRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        typeRect.setAttribute('x', '28'); typeRect.setAttribute('y', typeY);
        typeRect.setAttribute('width', '36'); typeRect.setAttribute('height', '14');
        typeRect.setAttribute('rx', '4'); typeRect.setAttribute('fill', tc.bg);
        typeRect.setAttribute('stroke', tc.stroke); typeRect.setAttribute('stroke-width', '0.8');
        g.appendChild(typeRect);

        const typeText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        typeText.setAttribute('x', '46'); typeText.setAttribute('y', String(typeTextY));
        typeText.setAttribute('dominant-baseline', 'central'); typeText.setAttribute('text-anchor', 'middle');
        typeText.setAttribute('font-size', '8'); typeText.setAttribute('fill', tc.fill);
        typeText.setAttribute('font-weight', '600');
        typeText.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif');
        typeText.textContent = stepType;
        g.appendChild(typeText);
    }

    // 展开/收起按钮
    if (hasChildren) {
        const btnX = nodeW - 4;
        const btnY = nodeH / 2;
        const btnR = 10;

        const bgCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        bgCircle.setAttribute('cx', btnX); bgCircle.setAttribute('cy', btnY);
        bgCircle.setAttribute('r', btnR); bgCircle.setAttribute('fill', '#fff');
        bgCircle.setAttribute('stroke', color); bgCircle.setAttribute('stroke-width', '1.5');
        bgCircle.classList.add('flow-expand-btn');
        g.appendChild(bgCircle);

        const symbol = isExpanded ? '−' : '+';
        const plusText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        plusText.setAttribute('x', btnX); plusText.setAttribute('y', btnY + 1);
        plusText.setAttribute('dominant-baseline', 'central'); plusText.setAttribute('text-anchor', 'middle');
        plusText.setAttribute('font-size', '14'); plusText.setAttribute('fill', color);
        plusText.setAttribute('font-weight', '700');
        plusText.textContent = symbol;
        g.appendChild(plusText);

        bgCircle.addEventListener('click', ev => {
            ev.stopPropagation();
            if (isExpanded) expandedNodes.delete(step.id);
            else expandedNodes.add(step.id);
            renderFlowchart();
        });
        plusText.addEventListener('click', ev => {
            ev.stopPropagation();
            if (isExpanded) expandedNodes.delete(step.id);
            else expandedNodes.add(step.id);
            renderFlowchart();
        });
    }

    // 步骤编号（右上角，仅真实步骤节点显示）
    if (stepCode) {
        const codeT = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        codeT.setAttribute('x', String(nodeW - (hasChildren ? 18 : 6)));
        codeT.setAttribute('y', '11');
        codeT.setAttribute('text-anchor', 'end');
        codeT.setAttribute('font-size', '8.5');
        codeT.setAttribute('fill', '#94a3b8');
        codeT.setAttribute('font-weight', '600');
        codeT.setAttribute('font-family', 'monospace,"Courier New"');
        codeT.textContent = stepCode;
        g.appendChild(codeT);
    }

    svg.appendChild(g);
}

function getMaxDepth(steps) {
    return steps.length > 0 ? Math.max(...steps.map(s => s.level || 1)) : 1;
}

// ── 保存流程图 ────────────────────────────────────────────
$('#btn-save-flow').addEventListener('click', async () => {
    if (!currentProductId) return;
    const title = ($('#flow-title').value || '').trim();
    const chartData = JSON.stringify({ steps });
    try {
        await fetch('/api/products/' + currentProductId + '/chart', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chart_data: chartData, title: title || null }),
        });
        // 自动记录变更日志
        const desc = prompt('请输入本次变更说明（可留空）：', '') ?? '';
        await addChangelog(desc || '保存');
        alert('✅ 已保存');
    } catch (e) { alert('保存失败：' + e.message); }
});

// ── 工具 ──────────────────────────────────────────────────
function esc(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function exportStepsExcel() {
    if (!currentProductId) return;
    const a = document.createElement('a');
    a.href = `/api/products/${currentProductId}/steps/export`;
    a.download = '';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

async function manualAddChangelog() {
    const input = $('#changelogNewDesc');
    const desc = (input.value || '').trim();
    if (!desc) { alert('请输入变更说明'); return; }
    await addChangelog(desc);
    input.value = '';
    await openChangelogModal(); // 刷新列表
}

// ── 初始化 ────────────────────────────────────────────────
$('#btn-add-product').addEventListener('click', () => openProductModal());
showView('list');
loadProducts();
