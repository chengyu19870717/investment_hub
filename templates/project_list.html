<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目清单 - 程钰的百宝箱</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/css/style.css?v=8">
    <style>
        body { background:#f4f6f8; }
        .pl-page { max-width:1320px; }
        .pl-header { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 24px; }
        .pl-title { display:flex; align-items:center; gap:12px; min-width:0; }
        .pl-title-main { font-size:18px; font-weight:850; color:var(--text-primary); }
        .pl-title-sub { color:var(--text-muted); font-size:12px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:760px; }
        .pl-main { padding:18px 24px 36px; display:flex; flex-direction:column; gap:14px; }
        .pl-toolbar { background:#fff; border:1px solid var(--border); border-radius:8px; padding:14px; display:grid; grid-template-columns:minmax(260px,1fr) 180px auto auto; gap:10px; align-items:center; box-shadow:0 1px 3px rgba(15,23,42,.06); }
        .pl-input, .pl-select { width:100%; border:1px solid var(--border); border-radius:8px; background:#f8fafc; color:var(--text-primary); padding:9px 10px; font-size:13px; font-family:inherit; outline:none; }
        .pl-input:focus, .pl-select:focus { border-color:#0f766e; box-shadow:0 0 0 3px rgba(15,118,110,.12); }
        .pl-btn { min-height:36px; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--text-secondary); font-size:13px; font-weight:750; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; padding:0 12px; white-space:nowrap; }
        .pl-btn:hover { background:#f8fafc; color:var(--text-primary); }
        .pl-btn.primary { background:#0f766e; border-color:#0f766e; color:#fff; }
        .pl-stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
        .pl-stat { background:#fff; border:1px solid var(--border); border-radius:8px; padding:12px 13px; box-shadow:0 1px 3px rgba(15,23,42,.06); min-width:0; }
        .pl-stat-label { font-size:12px; color:#64748b; }
        .pl-stat-value { margin-top:5px; font-size:18px; line-height:1.25; font-weight:850; color:#111827; overflow-wrap:anywhere; }
        .pl-status { min-height:36px; display:flex; align-items:center; padding:9px 11px; border-radius:8px; background:#ecfeff; color:#155e75; font-size:12px; line-height:1.55; }
        .pl-status.bad { background:#fef2f2; color:#991b1b; }
        .pl-status.good { background:#f0fdf4; color:#166534; }
        .pl-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:12px; }
        .pl-card { background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:14px; box-shadow:0 1px 3px rgba(15,23,42,.06); display:flex; flex-direction:column; gap:10px; min-width:0; }
        .pl-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
        .pl-name { font-size:15px; font-weight:850; color:#111827; line-height:1.4; overflow-wrap:anywhere; }
        .pl-desc { color:#334155; font-size:13px; line-height:1.65; overflow-wrap:anywhere; min-height:42px; }
        .pl-meta { display:flex; flex-wrap:wrap; gap:6px; }
        .pl-chip { display:inline-flex; align-items:center; min-height:24px; border-radius:999px; padding:3px 9px; background:#e0f2fe; color:#075985; font-size:12px; border:0; }
        .pl-chip.soft { background:#f1f5f9; color:#475569; }
        .pl-path { color:#64748b; font-size:12px; line-height:1.55; overflow-wrap:anywhere; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:8px 9px; }
        .pl-actions { display:flex; gap:8px; flex-wrap:wrap; }
        .pl-empty { background:#fff; border:1px solid var(--border); border-radius:8px; color:#64748b; padding:18px; font-size:13px; line-height:1.7; }
        @media(max-width:960px) {
            .pl-toolbar { grid-template-columns:1fr 1fr; }
            .pl-stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
        }
        @media(max-width:680px) {
            .pl-header { align-items:flex-start; flex-direction:column; padding:12px 14px; }
            .pl-main { padding:14px; }
            .pl-toolbar, .pl-stats, .pl-list { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>
<div class="page pl-page">
    <header class="header">
        <div class="pl-header">
            <div class="pl-title">
                <a href="/" class="back-btn">←</a>
                <div class="logo"><span class="logo-icon">🧭</span></div>
                <div>
                    <div class="pl-title-main">项目清单</div>
                    <div class="pl-title-sub" id="rootText">读取项目目录中...</div>
                </div>
            </div>
            <button class="pl-btn" type="button" onclick="loadProjects()">刷新</button>
        </div>
    </header>

    <main class="pl-main">
        <section class="pl-toolbar">
            <input class="pl-input" id="searchInput" placeholder="搜索项目、简介、路径" oninput="renderProjects()">
            <select class="pl-select" id="categorySelect" onchange="renderProjects()"></select>
            <button class="pl-btn" type="button" onclick="copyRoot()">复制根目录</button>
            <button class="pl-btn primary" type="button" onclick="loadProjects()">重新扫描</button>
        </section>

        <section class="pl-stats">
            <div class="pl-stat">
                <div class="pl-stat-label">项目数量</div>
                <div class="pl-stat-value" id="totalText">-</div>
            </div>
            <div class="pl-stat">
                <div class="pl-stat-label">扫描目录</div>
                <div class="pl-stat-value" id="rootStat">-</div>
            </div>
            <div class="pl-stat">
                <div class="pl-stat-label">最近扫描</div>
                <div class="pl-stat-value" id="scanText">-</div>
            </div>
            <div class="pl-stat">
                <div class="pl-stat-label">当前筛选</div>
                <div class="pl-stat-value" id="visibleText">-</div>
            </div>
        </section>

        <div id="statusBox" class="pl-status">等待扫描</div>
        <section id="projectList" class="pl-list"></section>
    </main>
</div>

<script>
const rootText = document.getElementById('rootText');
const totalText = document.getElementById('totalText');
const rootStat = document.getElementById('rootStat');
const scanText = document.getElementById('scanText');
const visibleText = document.getElementById('visibleText');
const statusBox = document.getElementById('statusBox');
const projectList = document.getElementById('projectList');
const searchInput = document.getElementById('searchInput');
const categorySelect = document.getElementById('categorySelect');
let inventory = {root:'', projects:[]};

function setStatus(text, kind = '') {
    statusBox.textContent = text;
    statusBox.className = 'pl-status' + (kind ? ' ' + kind : '');
}

async function loadProjects() {
    try {
        setStatus('正在扫描项目目录...');
        const res = await fetch('/api/project-list', {cache:'no-store'});
        const data = await res.json();
        if (!res.ok || data.ok === false) throw new Error(data.error || '扫描失败');
        inventory = data;
        rootText.textContent = data.root || '';
        totalText.textContent = data.total || 0;
        rootStat.textContent = shortPath(data.root || '');
        scanText.textContent = data.generated_at || '-';
        renderCategories();
        renderProjects();
        setStatus('项目清单已更新', 'good');
    } catch(e) {
        setStatus(e.message, 'bad');
    }
}

function renderCategories() {
    const current = categorySelect.value;
    const categories = Array.from(new Set((inventory.projects || []).map(item => item.category || '项目'))).sort();
    categorySelect.textContent = '';
    const all = document.createElement('option');
    all.value = '';
    all.textContent = '全部类型';
    categorySelect.appendChild(all);
    categories.forEach(category => {
        const opt = document.createElement('option');
        opt.value = category;
        opt.textContent = category;
        categorySelect.appendChild(opt);
    });
    if (current && categories.includes(current)) categorySelect.value = current;
}

function renderProjects() {
    const query = searchInput.value.trim().toLowerCase();
    const category = categorySelect.value;
    const items = (inventory.projects || []).filter(item => {
        if (category && item.category !== category) return false;
        if (!query) return true;
        const haystack = [
            item.name, item.description, item.path, item.category,
            ...(item.tags || []), ...(item.children || [])
        ].join(' ').toLowerCase();
        return haystack.includes(query);
    });
    visibleText.textContent = items.length + ' / ' + ((inventory.projects || []).length || 0);
    projectList.textContent = '';
    if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'pl-empty';
        empty.textContent = '没有匹配的项目。';
        projectList.appendChild(empty);
        return;
    }
    items.forEach(item => projectList.appendChild(projectCard(item)));
}

function projectCard(item) {
    const card = document.createElement('article');
    card.className = 'pl-card';

    const top = document.createElement('div');
    top.className = 'pl-card-top';
    const name = document.createElement('div');
    name.className = 'pl-name';
    name.textContent = item.name || '';
    const category = document.createElement('span');
    category.className = 'pl-chip';
    category.textContent = item.category || '项目';
    top.appendChild(name);
    top.appendChild(category);

    const desc = document.createElement('div');
    desc.className = 'pl-desc';
    desc.textContent = item.description || '暂无项目简介。';

    const meta = document.createElement('div');
    meta.className = 'pl-meta';
    (item.tags || []).forEach(tag => meta.appendChild(chip(tag)));
    if (item.description_source) meta.appendChild(chip('来源：' + item.description_source, 'soft'));
    if (item.updated_at) meta.appendChild(chip(item.updated_at, 'soft'));

    if ((item.children || []).length) {
        const children = document.createElement('div');
        children.className = 'pl-meta';
        item.children.slice(0, 8).forEach(child => children.appendChild(chip(child, 'soft')));
        card.appendChild(top);
        card.appendChild(desc);
        card.appendChild(meta);
        card.appendChild(children);
    } else {
        card.appendChild(top);
        card.appendChild(desc);
        card.appendChild(meta);
    }

    const path = document.createElement('div');
    path.className = 'pl-path';
    path.textContent = item.path || '';

    const actions = document.createElement('div');
    actions.className = 'pl-actions';
    const copy = document.createElement('button');
    copy.className = 'pl-btn';
    copy.type = 'button';
    copy.textContent = '复制路径';
    copy.onclick = () => copyValue(item.path || '');
    const open = document.createElement('button');
    open.className = 'pl-btn';
    open.type = 'button';
    open.textContent = '打开目录';
    open.onclick = () => openProject(item.path || '');
    actions.appendChild(copy);
    actions.appendChild(open);

    card.appendChild(path);
    card.appendChild(actions);
    return card;
}

function chip(text, mode = '') {
    const span = document.createElement('span');
    span.className = 'pl-chip' + (mode ? ' ' + mode : '');
    span.textContent = text;
    return span;
}

async function openProject(path) {
    try {
        const res = await fetch('/api/project-list/open', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({path})
        });
        const data = await res.json();
        if (!res.ok || data.ok === false) throw new Error(data.error || '打开目录失败');
        setStatus('目录已打开', 'good');
    } catch(e) {
        setStatus(e.message, 'bad');
    }
}

async function copyRoot() {
    await copyValue(inventory.root || '');
}

async function copyValue(text) {
    if (!text) return;
    await navigator.clipboard.writeText(text);
    setStatus('已复制到剪贴板', 'good');
}

function shortPath(path) {
    return String(path || '').replace(/^\/Users\/chengyu/, '~');
}

loadProjects();
</script>
</body>
</html>
