<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件整理 - 程钰的百宝箱</title>
    <link rel="stylesheet" href="/static/css/style.css?v=12">
</head>
<body>
    <div class="page">
        <header class="header">
            <div class="header-inner">
                <div style="display:flex;align-items:center;justify-content:space-between;">
                    <div class="logo">
                        <a href="/" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:8px;">
                            <span class="logo-icon">🧰</span>
                            <span class="logo-text">程钰的百宝箱</span>
                        </a>
                    </div>
                    <a href="/settings" title="设置" style="color:var(--text-muted);font-size:20px;text-decoration:none;padding:4px 8px;border-radius:8px;">⚙️</a>
                </div>
            </div>
        </header>

        <main class="main">
            <div id="toast"></div>

            <div class="section-label">🗃️ 整理目录</div>
            <div class="fo-grid" id="dirGrid"></div>

            <div class="fo-panel" style="margin-top:14px;">
                <div class="fo-row">
                    <input class="fo-input" id="newDir" placeholder="添加目录，如 ~/Desktop/资料（仅限主目录下）">
                    <button class="fo-btn" id="addDirBtn">添加目录</button>
                    <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);">
                        <input type="checkbox" id="includeHidden"> 含隐藏文件
                    </label>
                </div>
            </div>

            <div class="section-label">📋 上次整理结果</div>
            <div class="fo-panel" id="resultPanel">
                <span style="color:var(--text-muted);font-size:14px;">还没有整理过。点上面任意目录的「一键整理」开始。</span>
            </div>

            <div class="section-label">🕘 整理历史（可撤销）</div>
            <div class="fo-panel"><table class="fo-table"><tbody id="runsBody"></tbody></table></div>

            <div class="section-label">⚙️ 分类规则（从上往下匹配，命中即停）</div>
            <div class="fo-panel">
                <table class="fo-table">
                    <thead><tr>
                        <th style="width:82px;">顺序</th><th style="width:160px;">分类目录</th>
                        <th style="width:110px;">匹配方式</th><th>匹配内容（多个用 | 分隔）</th>
                        <th style="width:52px;text-align:center;">启用</th><th style="width:74px;"></th>
                    </tr></thead>
                    <tbody id="rulesBody"></tbody>
                </table>
                <div class="fo-row" style="margin-top:12px;">
                    <input class="fo-input fo-input--sm" id="nPriority" type="number" placeholder="顺序" value="500">
                    <input class="fo-input" id="nCategory" placeholder="分类目录名" style="max-width:160px;">
                    <select class="fo-input fo-input--sm" id="nType">
                        <option value="keyword">文件名</option>
                        <option value="ext">扩展名</option>
                    </select>
                    <input class="fo-input" id="nPattern" placeholder="匹配内容，如 合同|协议">
                    <button class="fo-btn fo-btn--primary" id="addRuleBtn">新增规则</button>
                </div>
                <div style="margin-top:10px;font-size:12px;color:var(--text-muted);">
                    顺序数字越小越先匹配。规则都没命中的文件会进「其他-待整理」。
                </div>
            </div>
        </main>

        <footer class="footer"><span>程钰的百宝箱 · 本地版</span></footer>
    </div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, isError) {
    $('toast').innerHTML = `<div class="fo-toast ${isError ? 'fo-toast--error' : ''}">${esc(msg)}</div>`;
    setTimeout(() => { $('toast').innerHTML = ''; }, 4000);
}

async function api(url, opts) {
    const res  = await fetch(url, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) throw new Error(data.error || `请求失败 (${res.status})`);
    return data;
}

const includeHidden = () => $('includeHidden').checked;

// ── 目录 ──────────────────────────────────────────────
async function loadDirs() {
    const { dirs } = await api('/api/file-organizer/dirs');
    $('dirGrid').innerHTML = dirs.map(d => d.missing ? `
        <div class="fo-dir fo-dir--missing">
            <div class="fo-dir-name">⚠️ ${esc(d.name || d.path)}</div>
            <div class="fo-dir-path">${esc(d.path)}</div>
            <div class="fo-dir-stat">${esc(d.error || '目录不可用')}</div>
            <div class="fo-dir-actions">
                <button class="fo-btn fo-btn--danger" data-del="${d.id}">移出列表</button>
            </div>
        </div>` : `
        <div class="fo-dir">
            <div class="fo-dir-name">${esc(d.name)}</div>
            <div class="fo-dir-path">${esc(d.path)}</div>
            <div class="fo-dir-stat"><b>${d.loose_count}</b> 个散落文件 · ${d.subdir_count} 个子目录</div>
            <div class="fo-dir-actions">
                <button class="fo-btn fo-btn--primary" data-run="${esc(d.path)}"
                        ${d.loose_count ? '' : 'disabled'}>一键整理</button>
                <button class="fo-btn" data-preview="${esc(d.path)}"
                        ${d.loose_count ? '' : 'disabled'}>预览</button>
                <button class="fo-btn fo-btn--danger" data-del="${d.id}">移出</button>
            </div>
        </div>`).join('') || '<span style="color:var(--text-muted);font-size:14px;">还没有纳管任何目录。</span>';
}

$('dirGrid').addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    btn.disabled = true;
    try {
        if (btn.dataset.del) {
            await api(`/api/file-organizer/dirs/${btn.dataset.del}`, { method: 'DELETE' });
            await loadDirs();
        } else if (btn.dataset.run) {
            const r = await api('/api/file-organizer/organize', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: btn.dataset.run, include_hidden: includeHidden() }),
            });
            renderResult(r);
            toast(`已整理 ${r.moved} 个文件`);
            await Promise.all([loadDirs(), loadRuns()]);
        } else if (btn.dataset.preview) {
            const r = await api('/api/file-organizer/preview', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: btn.dataset.preview, include_hidden: includeHidden() }),
            });
            renderPreview(r);
        }
    } catch (err) {
        toast(err.message, true);
    } finally {
        btn.disabled = false;
    }
});

$('addDirBtn').addEventListener('click', async () => {
    const path = $('newDir').value.trim();
    if (!path) return;
    try {
        await api('/api/file-organizer/dirs', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path }),
        });
        $('newDir').value = '';
        await loadDirs();
        toast('目录已添加');
    } catch (err) { toast(err.message, true); }
});

// ── 结果 / 预览 ───────────────────────────────────────
function movesTable(rows, title) {
    if (!rows.length) return `<span style="color:var(--text-muted);font-size:14px;">没有可整理的文件。</span>`;
    const chips = {};
    rows.forEach(r => { chips[r.category] = (chips[r.category] || 0) + 1; });
    return `
        <div style="margin-bottom:10px;font-size:14px;">${esc(title)}
            ${Object.entries(chips).map(([c, n]) =>
                `<span class="fo-chip" style="margin-left:6px;">${esc(c)} ${n}</span>`).join('')}
        </div>
        <table class="fo-table">
            <thead><tr><th>文件</th><th style="width:170px;">归入</th><th style="width:190px;">依据</th></tr></thead>
            <tbody>${rows.map(r => `<tr>
                <td class="fo-file">${esc(r.filename)}</td>
                <td><span class="fo-chip">${esc(r.category)}</span></td>
                <td style="color:var(--text-muted);">${esc(r.reason)}</td>
            </tr>`).join('')}</tbody>
        </table>`;
}

function renderResult(r) {
    let html = movesTable(r.details || [], `本次移动 ${r.moved} 个文件：`);
    if (r.skipped && r.skipped.length) {
        html += `<div style="margin-top:12px;font-size:13px;color:#ff3b30;">跳过 ${r.skipped.length} 个：` +
            r.skipped.map(s => `${esc(s.filename)}（${esc(s.reason)}）`).join('、') + '</div>';
    }
    $('resultPanel').innerHTML = html;
}

function renderPreview(r) {
    $('resultPanel').innerHTML =
        `<div class="fo-chip fo-chip--muted" style="margin-bottom:8px;">预览 · 尚未移动任何文件</div>` +
        movesTable(r.items || [], `将移动 ${r.total} 个文件：`);
}

// ── 历史 ──────────────────────────────────────────────
async function loadRuns() {
    const { runs } = await api('/api/file-organizer/runs');
    $('runsBody').innerHTML = runs.length ? runs.map(r => `<tr>
        <td style="width:150px;color:var(--text-muted);">${esc((r.created_at || '').replace('T', ' '))}</td>
        <td class="fo-file">${esc(r.directory)}</td>
        <td style="width:90px;">${r.moved_count} 个</td>
        <td style="width:110px;">${r.undone_at
            ? '<span class="fo-chip fo-chip--muted">已撤销</span>'
            : `<button class="fo-btn fo-btn--danger" data-undo="${r.id}">撤销</button>`}</td>
    </tr>`).join('') : '<tr><td style="color:var(--text-muted);">暂无记录</td></tr>';
}

$('runsBody').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-undo]');
    if (!btn) return;
    if (!confirm('把这次整理移动过的文件全部搬回原位？')) return;
    btn.disabled = true;
    try {
        const r = await api(`/api/file-organizer/runs/${btn.dataset.undo}/undo`, { method: 'POST' });
        toast(`已还原 ${r.restored} 个文件` + (r.failed.length ? `，${r.failed.length} 个未能还原` : ''));
        await Promise.all([loadDirs(), loadRuns()]);
    } catch (err) {
        toast(err.message, true);
        btn.disabled = false;
    }
});

// ── 规则 ──────────────────────────────────────────────
async function loadRules() {
    const { rules } = await api('/api/file-organizer/rules');
    $('rulesBody').innerHTML = rules.map(r => `<tr data-id="${r.id}">
        <td><input class="fo-input fo-input--sm" data-f="priority" type="number" value="${r.priority}"></td>
        <td><input class="fo-input" data-f="category" value="${esc(r.category)}"></td>
        <td><select class="fo-input" data-f="match_type">
            <option value="keyword" ${r.match_type === 'keyword' ? 'selected' : ''}>文件名</option>
            <option value="ext" ${r.match_type === 'ext' ? 'selected' : ''}>扩展名</option>
        </select></td>
        <td><input class="fo-input" data-f="pattern" value="${esc(r.pattern)}"></td>
        <td style="text-align:center;"><input type="checkbox" data-f="enabled" ${r.enabled ? 'checked' : ''}></td>
        <td><button class="fo-btn fo-btn--danger" data-delrule="${r.id}">删除</button></td>
    </tr>`).join('');
}

// 改完即存：输入框失焦、下拉/勾选变化时提交整行
$('rulesBody').addEventListener('change', async (e) => {
    const tr = e.target.closest('tr[data-id]');
    if (!tr || e.target.dataset.f === undefined) return;
    const val = f => tr.querySelector(`[data-f="${f}"]`);
    try {
        await api(`/api/file-organizer/rules/${tr.dataset.id}`, {
            method: 'PATCH', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                category:   val('category').value,
                match_type: val('match_type').value,
                pattern:    val('pattern').value,
                priority:   Number(val('priority').value) || 500,
                enabled:    val('enabled').checked ? 1 : 0,
            }),
        });
        toast('规则已保存');
    } catch (err) { toast(err.message, true); }
});

$('rulesBody').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-delrule]');
    if (!btn) return;
    try {
        await api(`/api/file-organizer/rules/${btn.dataset.delrule}`, { method: 'DELETE' });
        await loadRules();
    } catch (err) { toast(err.message, true); }
});

$('addRuleBtn').addEventListener('click', async () => {
    try {
        await api('/api/file-organizer/rules', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                category:   $('nCategory').value.trim(),
                match_type: $('nType').value,
                pattern:    $('nPattern').value.trim(),
                priority:   Number($('nPriority').value) || 500,
                enabled:    1,
            }),
        });
        $('nCategory').value = ''; $('nPattern').value = '';
        await loadRules();
        toast('规则已新增');
    } catch (err) { toast(err.message, true); }
});

Promise.all([loadDirs(), loadRules(), loadRuns()]).catch(err => toast(err.message, true));
</script>
</body>
</html>
