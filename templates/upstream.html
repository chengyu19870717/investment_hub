<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上下游分析 · 程钰的百宝箱</title>
<link rel="stylesheet" href="/static/css/style.css?v=13">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-body,#0f111a);color:var(--text-primary,#e2e8f0);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
.up-header{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid rgba(255,255,255,.06)}
.up-header .back{color:var(--text-muted,#64748b);text-decoration:none;font-size:13px;display:flex;align-items:center;gap:4px;transition:color .2s}
.up-header .back:hover{color:var(--text-primary,#e2e8f0)}
.up-header h1{font-size:16px;font-weight:600;flex:1}
.up-header .actions{display:flex;gap:8px}
.btn-sm{padding:5px 12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:var(--text-muted,#94a3b8);border-radius:8px;cursor:pointer;font-size:12px;transition:all .2s}
.btn-sm:hover,.btn-sm.active{background:rgba(99,102,241,.2);border-color:rgba(99,102,241,.5);color:#a5b4fc}
.industry-tabs{display:flex;gap:8px;padding:14px 24px;border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.ind-tab{padding:7px 20px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);cursor:pointer;font-size:13px;font-weight:500;color:var(--text-muted,#94a3b8);transition:all .25s}
.ind-tab:hover{border-color:rgba(99,102,241,.4);color:#c7d2fe}
.ind-tab.active{background:rgba(99,102,241,.18);border-color:rgba(99,102,241,.6);color:#a5b4fc;font-weight:600}
.up-body{display:flex;height:calc(100vh - 113px);overflow:hidden}
.chain-area{flex:1;overflow:auto;padding:24px;position:relative}
.detail-panel{width:400px;min-width:400px;border-left:1px solid rgba(255,255,255,.07);overflow-y:auto;transform:translateX(100%);transition:transform .3s ease;background:#0f111a}
.detail-panel.open{transform:translateX(0)}
.chain-wrapper{display:flex;gap:0;min-height:600px;position:relative}
.chain-layer{flex:1;display:flex;flex-direction:column;gap:0;position:relative;padding:0 12px}
.layer-header{text-align:center;margin-bottom:16px;padding:6px 0}
.layer-label{display:inline-block;padding:3px 14px;border-radius:12px;font-size:11px;font-weight:600;letter-spacing:.05em}
.layer-label.raw_material{background:rgba(168,85,247,.12);color:#c084fc;border:1px solid rgba(168,85,247,.25)}
.layer-label.upstream{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.25)}
.layer-label.midstream{background:rgba(99,102,241,.12);color:#818cf8;border:1px solid rgba(99,102,241,.25)}
.layer-label.downstream{background:rgba(251,146,60,.12);color:#fb923c;border:1px solid rgba(251,146,60,.25)}
.layer-nodes{display:flex;flex-direction:column;gap:12px;align-items:center}
.chain-node{width:100%;max-width:220px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .25s;position:relative;user-select:none}
.chain-node:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);transform:translateY(-2px)}
.chain-node.selected{border-color:rgba(99,102,241,.7);background:rgba(99,102,241,.1);box-shadow:0 0 0 2px rgba(99,102,241,.25)}
.chain-node.has-holding{border-color:rgba(234,179,8,.6)!important;box-shadow:0 0 12px rgba(234,179,8,.15)}
.chain-node .node-name{font-size:13px;font-weight:600;margin-bottom:6px}
.chain-node .node-type{font-size:11px;color:var(--text-muted,#64748b);margin-bottom:8px}
.chain-node .node-tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.tag-loose{background:rgba(34,197,94,.15);color:#4ade80}
.tag-tight{background:rgba(234,179,8,.15);color:#facc15}
.tag-risky{background:rgba(239,68,68,.15);color:#f87171;animation:pulse-red 2s infinite}
.tag-rate{background:rgba(148,163,184,.1);color:#94a3b8}
.tag-holding{background:rgba(234,179,8,.2);color:#fbbf24}
@keyframes pulse-red{0%,100%{opacity:1}50%{opacity:.6}}
.chain-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
/* 详情面板 */
.dp-header{display:flex;align-items:flex-start;gap:12px;padding:20px;border-bottom:1px solid rgba(255,255,255,.06)}
.dp-close{cursor:pointer;color:var(--text-muted,#64748b);font-size:18px;line-height:1;transition:color .2s;background:none;border:none;padding:0}
.dp-close:hover{color:var(--text-primary,#e2e8f0)}
.dp-title{flex:1}
.dp-title h2{font-size:15px;font-weight:700}
.dp-title p{font-size:12px;color:var(--text-muted,#64748b);margin-top:3px}
.dp-section{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.05)}
.dp-section-title{font-size:11px;font-weight:700;color:var(--text-muted,#64748b);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.supply-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.supply-item{background:rgba(255,255,255,.04);border-radius:8px;padding:10px;text-align:center}
.supply-item .val{font-size:18px;font-weight:700;margin-bottom:2px}
.supply-item .lbl{font-size:10px;color:var(--text-muted,#64748b)}
.company-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:8px;position:relative;transition:all .2s;cursor:pointer}
.company-card:hover{border-color:rgba(99,102,241,.4);background:rgba(99,102,241,.06);transform:translateX(2px)}
.company-card.is-holding{border-color:rgba(234,179,8,.4);background:rgba(234,179,8,.05)}
.holding-badge{position:absolute;top:-8px;left:8px;background:#92400e;color:#fbbf24;font-size:9px;font-weight:700;padding:1px 6px;border-radius:6px}
.cc-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cc-identity{display:inline-flex;align-items:center;gap:6px}
.cc-code{font-size:11px;color:#818cf8;font-weight:600;background:rgba(99,102,241,.1);padding:1px 6px;border-radius:4px;white-space:nowrap}
.cc-name{font-size:13px;font-weight:700;color:#e2e8f0;white-space:nowrap}
.cc-patent{font-size:12px}
.leader-badge{display:inline-flex;align-items:center;gap:2px;font-size:9px;font-weight:800;padding:1px 6px;border-radius:5px;background:rgba(234,179,8,.18);color:#fbbf24;border:1px solid rgba(234,179,8,.35);white-space:nowrap}
.cc-purity{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.purity-item{text-align:center;background:rgba(255,255,255,.03);border-radius:6px;padding:6px}
.purity-item .pv{font-size:13px;font-weight:700}
.purity-item .pl{font-size:9px;color:var(--text-muted,#64748b);margin-top:1px}
.purity-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;margin-left:auto}
.pb-strong{background:rgba(34,197,94,.15);color:#4ade80}
.pb-main{background:rgba(34,197,94,.1);color:#86efac}
.pb-mixed{background:rgba(234,179,8,.12);color:#fbbf24}
.pb-concept{background:rgba(239,68,68,.12);color:#fca5a5}
.cc-tags{display:flex;flex-wrap:wrap;gap:4px}
.ctag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:600}
.ctag-entity{background:rgba(239,68,68,.15);color:#f87171}
.ctag-specialized{background:rgba(59,130,246,.15);color:#93c5fd}
.ctag-giant{background:rgba(139,92,246,.15);color:#c4b5fd}
.ctag-bigfund{background:rgba(234,179,8,.15);color:#fbbf24}
.cc-core{font-size:11px;color:var(--text-muted,#94a3b8);margin-bottom:6px}
/* 数据来源标 */
.src-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:4px;vertical-align:middle;cursor:help}
.src-official{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.2)}
.src-authoritative{background:rgba(148,163,184,.1);color:#94a3b8;border:1px solid rgba(148,163,184,.15)}
.src-reference{background:rgba(251,146,60,.1);color:#fb923c;border:1px solid rgba(251,146,60,.2)}
/* 公司详情视图 */
.cd-back{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(255,255,255,.04);color:#94a3b8;font-size:12px;cursor:pointer;transition:all .2s}
.cd-back:hover{border-color:rgba(99,102,241,.4);color:#a5b4fc}
.cd-market-share-bar{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.cd-ms-label{font-size:10px;color:#64748b;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.cd-ms-value{font-size:18px;font-weight:800;color:#4ade80}
.cd-ms-detail{font-size:11px;color:#64748b;margin-top:2px;line-height:1.4}
.cd-analysis{font-size:12px;color:#94a3b8;line-height:1.7;background:rgba(255,255,255,.02);border-left:2px solid rgba(99,102,241,.4);padding:8px 12px;border-radius:0 6px 6px 0}
.cd-relation-list{display:flex;flex-direction:column;gap:6px}
.cd-relation-item{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:8px 12px}
.cd-relation-type{font-size:10px;color:#64748b;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.06);white-space:nowrap}
.cd-stake{font-size:11px;font-weight:700;color:#fbbf24;margin-left:auto;white-space:nowrap}
.cd-no-relation{font-size:12px;color:#475569;padding:10px 0;text-align:center}
.empty-chain{text-align:center;padding:80px 20px;color:var(--text-muted,#64748b)}
.empty-chain .emoji{font-size:48px;margin-bottom:12px}
.layer-sep{width:40px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.2);font-size:20px;flex-shrink:0;padding-top:60px}
.node-products{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.node-product-chip{font-size:10px;padding:1px 7px;border-radius:8px;background:rgba(99,102,241,.1);color:#818cf8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.node-companies{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.node-co{font-size:10px;padding:1px 7px;border-radius:8px;white-space:nowrap}
.node-co.listed{background:rgba(234,179,8,.1);color:#fbbf24}
.node-co.unlisted{background:rgba(148,163,184,.08);color:#94a3b8}
.node-co-more{font-size:10px;color:#475569;padding:1px 4px}
/* ── 持仓股管理弹窗 ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:#1a1d2e;border:1px solid rgba(255,255,255,.1);border-radius:16px;width:480px;max-width:90vw;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.modal-head{display:flex;align-items:center;padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.07)}
.modal-head h2{font-size:15px;font-weight:700;flex:1}
.modal-head .count{font-size:12px;color:#64748b;margin-right:12px}
.modal-close{background:none;border:none;color:#64748b;font-size:18px;cursor:pointer;padding:0;line-height:1;transition:color .2s}
.modal-close:hover{color:#e2e8f0}
.modal-body{flex:1;overflow-y:auto;padding:16px 24px}
.stock-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.stock-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 14px;transition:border-color .2s}
.stock-row:hover{border-color:rgba(255,255,255,.15)}
.stock-row.is-active{border-color:rgba(234,179,8,.35);background:rgba(234,179,8,.04)}
.stock-code{font-size:12px;color:#818cf8;font-weight:600;background:rgba(99,102,241,.1);padding:2px 8px;border-radius:6px;white-space:nowrap}
.stock-name{flex:1;font-size:13px;font-weight:600;color:#c084fc}
.stock-industry{font-size:11px;color:#64748b}
.stock-del{background:none;border:1px solid rgba(239,68,68,.2);color:#f87171;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px;transition:all .2s;white-space:nowrap}
.stock-del:hover{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.5)}
.add-form{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:14px}
.add-form-title{font-size:11px;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.add-form-row{display:flex;gap:8px}
.add-input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:7px 10px;color:#e2e8f0;font-size:13px;outline:none;transition:border-color .2s}
.add-input:focus{border-color:rgba(99,102,241,.5)}
.add-input::placeholder{color:#475569}
.add-btn{padding:7px 16px;background:rgba(99,102,241,.2);border:1px solid rgba(99,102,241,.4);border-radius:8px;color:#a5b4fc;font-size:13px;cursor:pointer;font-weight:600;transition:all .2s;white-space:nowrap}
.add-btn:hover{background:rgba(99,102,241,.35)}
.add-hint{font-size:11px;color:#475569;margin-top:8px}
.modal-foot{padding:16px 24px;border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:flex-end;gap:8px}
.btn-primary{padding:8px 20px;background:rgba(99,102,241,.25);border:1px solid rgba(99,102,241,.5);border-radius:8px;color:#a5b4fc;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary:hover{background:rgba(99,102,241,.4)}
</style>
</head>
<body>
<div class="up-header">
  {% if not embedded %}
  <a class="back" href="/">&#8592; 返回</a>
  {% endif %}
  <h1>&#128279; 上下游分析</h1>
  <div class="actions">
    <button class="btn-sm" id="btnHolding" onclick="toggleHoldingMode()">&#128204; 持仓高亮</button>
    <button class="btn-sm" onclick="openStockManager()">&#9881;&#65039; 管理持仓股</button>
  </div>
</div>
<div class="industry-tabs" id="industryTabs"></div>
<div class="up-body">
  <div class="chain-area" id="chainArea">
    <div class="empty-chain"><div class="emoji">&#128279;</div><div>加载中...</div></div>
  </div>
  <div class="detail-panel" id="detailPanel">
    <div id="detailContent"></div>
  </div>
</div>

<!-- 持仓股管理弹窗 -->
<div class="modal-overlay" id="stockModal" onclick="handleModalClick(event)">
  <div class="modal-box">
    <div class="modal-head">
      <h2>&#128204; 管理持仓股</h2>
      <span class="count" id="stockCount"></span>
      <button class="modal-close" onclick="closeStockManager()">&#10005;</button>
    </div>
    <div class="modal-body">
      <div class="stock-list" id="stockList"></div>
      <div class="add-form">
        <div class="add-form-title">添加新持仓股</div>
        <div class="add-form-row">
          <input class="add-input" id="addCode" placeholder="股票代码，如 300244" maxlength="10" oninput="this.value=this.value.toUpperCase()">
          <input class="add-input" id="addName" placeholder="股票名称，如 迪安诊断" maxlength="20">
          <button class="add-btn" onclick="addStock()">添加</button>
        </div>
        <div class="add-hint">代码唯一，重复代码不会重复添加</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-primary" onclick="closeStockManager()">完成</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
// 持仓股管理
// ═══════════════════════════════════════════════
var DEFAULT_HOLDINGS = [
  {code:'300244',name:'迪安诊断'},
  {code:'603881',name:'数据港'},
  {code:'300364',name:'中文在线'},
  {code:'301396',name:'宏景科技'},
  {code:'002173',name:'创新医疗'},
  {code:'600749',name:'西藏旅游'}
];

function loadHoldings(){
  try {
    var saved = JSON.parse(localStorage.getItem('holding_stocks_v2') || 'null');
    return saved || DEFAULT_HOLDINGS;
  } catch(e){ return DEFAULT_HOLDINGS; }
}

function saveHoldings(list){
  localStorage.setItem('holding_stocks_v2', JSON.stringify(list));
}

var holdingList = loadHoldings();
var HOLDING_STOCKS = new Set(holdingList.map(function(h){ return h.code; }));
var holdingMode = true;

function toggleHoldingMode(){
  holdingMode = !holdingMode;
  document.getElementById('btnHolding').classList.toggle('active', holdingMode);
  renderCurrentIndustry();
  if(selectedNodeId) showDetail(selectedNodeId);
}

// ── 弹窗逻辑 ──
function openStockManager(){
  renderStockList();
  document.getElementById('stockModal').classList.add('open');
}

function closeStockManager(){
  document.getElementById('stockModal').classList.remove('open');
  HOLDING_STOCKS = new Set(holdingList.map(function(h){ return h.code; }));
  renderCurrentIndustry();
  if(selectedNodeId) showDetail(selectedNodeId);
}

function handleModalClick(e){
  if(e.target === document.getElementById('stockModal')) closeStockManager();
}

function renderStockList(){
  var list = holdingList;
  document.getElementById('stockCount').textContent = list.length + ' 只';
  var html = '';
  for(var i=0;i<list.length;i++){
    var s = list[i];
    html += '<div class="stock-row is-active">'
      + '<span class="stock-code">'+esc(s.code)+'</span>'
      + '<span class="stock-name">'+esc(s.name)+'</span>'
      + '<button class="stock-del" onclick="removeStock(\''+esc(s.code)+'\')">移除</button>'
      + '</div>';
  }
  if(!html) html = '<div style="text-align:center;padding:20px;color:#475569;font-size:13px">暂无持仓股，请添加</div>';
  document.getElementById('stockList').innerHTML = html;
}

function addStock(){
  var code = document.getElementById('addCode').value.trim();
  var name = document.getElementById('addName').value.trim();
  if(!code){ alert('请输入股票代码'); return; }
  if(!name){ alert('请输入股票名称'); return; }
  for(var i=0;i<holdingList.length;i++){
    if(holdingList[i].code === code){
      alert('代码 '+code+' 已存在（'+holdingList[i].name+'）'); return;
    }
  }
  holdingList.push({code:code, name:name});
  saveHoldings(holdingList);
  document.getElementById('addCode').value = '';
  document.getElementById('addName').value = '';
  renderStockList();
}

function removeStock(code){
  holdingList = holdingList.filter(function(h){ return h.code !== code; });
  saveHoldings(holdingList);
  renderStockList();
}

// ═══════════════════════════════════════════════
// 产业链数据
// ═══════════════════════════════════════════════
var INDUSTRY_DATA = {};

async function loadIndustryData(){
  try {
    var res = await fetch('/api/industry-chain');
    if(!res.ok) throw new Error('产业链数据加载失败');
    INDUSTRY_DATA = await res.json();
  } catch(e) {
    console.error(e);
    INDUSTRY_DATA = {};
  }
}

// ── 行业标签 ──
var currentIndustry = 'compute';

function renderTabs(){
  var html = '';
  var ids = Object.keys(INDUSTRY_DATA);
  for(var i=0;i<ids.length;i++){
    var ind = INDUSTRY_DATA[ids[i]];
    var cls = ind.id===currentIndustry?' active':'';
    html += '<div class="ind-tab'+cls+'" onclick="switchIndustry(\''+ind.id+'\')">'+esc(ind.name)+'</div>';
  }
  document.getElementById('industryTabs').innerHTML = html;
}

function switchIndustry(id){
  currentIndustry = id;
  closeDetail();
  renderTabs();
  renderCurrentIndustry();
}

// ── 产业链渲染 ──
function renderCurrentIndustry(){
  var area = document.getElementById('chainArea');
  var industry = INDUSTRY_DATA[currentIndustry];
  if(!industry){ area.innerHTML='<div class="empty-chain"><div class="emoji">&#128279;</div><div>数据暂未收录</div></div>'; return; }
  var layers={raw_material:[],upstream:[],midstream:[],downstream:[]};
  for(var i=0;i<industry.nodes.length;i++){
    var l=industry.nodes[i].layer;
    if(layers[l]) layers[l].push(industry.nodes[i]);
  }
  var html='<div style="position:relative"><svg class="chain-svg" id="chainSvg"></svg>'
    +'<div class="chain-wrapper" id="chainWrapper">';
  if(layers.raw_material.length>0){
    html+=renderLayer('raw_material','原材料',layers.raw_material)
      +'<div class="layer-sep">&#8594;</div>';
  }
  html+=renderLayer('upstream','上游',layers.upstream)
    +'<div class="layer-sep">&#8594;</div>'
    +renderLayer('midstream','中游',layers.midstream)
    +'<div class="layer-sep">&#8594;</div>'
    +renderLayer('downstream','下游',layers.downstream)
    +'</div></div>';
  area.innerHTML=html;
  setTimeout(drawConnections,120);
}

function renderLayer(type,label,nodes){
  var html='<div class="chain-layer"><div class="layer-header"><span class="layer-label '+type+'">'+esc(label)+'</span></div><div class="layer-nodes">';
  for(var i=0;i<nodes.length;i++) html+=renderNode(nodes[i]);
  return html+'</div></div>';
}

function renderNode(node){
  var hasHolding=holdingMode&&node.companies.some(function(c){return HOLDING_STOCKS.has(c.code);});
  var supplyTag=node.supply_level==='risky'?'<span class="tag tag-risky">&#9888; 断供风险</span>':node.supply_level==='tight'?'<span class="tag tag-tight">偏紧</span>':'<span class="tag tag-loose">宽松</span>';
  var rateTag='<span class="tag tag-rate">国产率 '+node.domestic_rate+'%</span>';
  var holdingTag=hasHolding?'<span class="tag tag-holding">&#128204; 持仓</span>':'';
  // 核心产品 chips（最多3个）
  var productsHtml='';
  var maxP=Math.min(3,node.core_products.length);
  for(var i=0;i<maxP;i++) productsHtml+='<span class="node-product-chip">'+esc(node.core_products[i])+'</span>';
  if(node.core_products.length>3) productsHtml+='<span class="node-co-more">+'+( node.core_products.length-3)+'</span>';
  // 头部企业列表（最多10家，上市显示[代码]名称，非上市显示名称）
  var cosHtml='';
  var maxC=Math.min(10,node.companies.length);
  for(var i=0;i<maxC;i++){
    var c=node.companies[i];
    var isListed=c.code&&c.code!=='未上市'&&c.code!=='——'&&c.exchange!=='——';
    if(isListed) cosHtml+='<span class="node-co listed">['+esc(c.code)+'] '+esc(c.name)+'</span>';
    else cosHtml+='<span class="node-co unlisted">'+esc(c.name)+'</span>';
  }
  if(node.companies.length>10) cosHtml+='<span class="node-co-more">+'+( node.companies.length-10)+'家</span>';
  return '<div class="chain-node'+(hasHolding?' has-holding':'')+'" id="node-'+node.id+'" onclick="showDetail(\''+node.id+'\')">'
    +'<div class="node-name">'+esc(node.name)+'</div>'
    +'<div class="node-type">'+esc(node.type)+'</div>'
    +(productsHtml?'<div class="node-products">'+productsHtml+'</div>':'')
    +'<div class="node-tags">'+supplyTag+rateTag+holdingTag+'</div>'
    +(cosHtml?'<div class="node-companies">'+cosHtml+'</div>':'')
    +'</div>';
}

// ── SVG 连线 ──
function drawConnections(){
  var svg=document.getElementById('chainSvg'),wrapper=document.getElementById('chainWrapper');
  if(!svg||!wrapper) return;
  var industry=INDUSTRY_DATA[currentIndustry];
  var wRect=wrapper.getBoundingClientRect();
  svg.setAttribute('viewBox','0 0 '+wRect.width+' '+wRect.height);
  svg.style.width=wRect.width+'px'; svg.style.height=wRect.height+'px';
  var lines='';
  for(var i=0;i<industry.nodes.length;i++){
    var node=industry.nodes[i];
    var fromEl=document.getElementById('node-'+node.id);
    if(!fromEl) continue;
    for(var j=0;j<node.children.length;j++){
      var toEl=document.getElementById('node-'+node.children[j]);
      if(!toEl) continue;
      var fr=fromEl.getBoundingClientRect(),tr=toEl.getBoundingClientRect();
      var x1=fr.right-wRect.left,y1=fr.top+fr.height/2-wRect.top;
      var x2=tr.left-wRect.left,y2=tr.top+tr.height/2-wRect.top;
      var cx=(x1+x2)/2;
      lines+='<path d="M'+x1+','+y1+' C'+cx+','+y1+' '+cx+','+y2+' '+x2+','+y2+'" fill="none" stroke="rgba(99,102,241,0.35)" stroke-width="1.5" stroke-dasharray="4,3"/>'
            +'<circle cx="'+x2+'" cy="'+y2+'" r="3" fill="rgba(99,102,241,0.5)"/>';
    }
  }
  svg.innerHTML=lines;
}

// ── 详情面板 ──
var selectedNodeId=null;
var LAYER_LABELS={upstream:'上游',midstream:'中游',downstream:'下游'};

function showDetail(nodeId){
  var industry=INDUSTRY_DATA[currentIndustry],node=null;
  for(var i=0;i<industry.nodes.length;i++) if(industry.nodes[i].id===nodeId){node=industry.nodes[i];break;}
  if(!node) return;
  var prevSel=document.querySelectorAll('.chain-node.selected');
  for(var i=0;i<prevSel.length;i++) prevSel[i].classList.remove('selected');
  var el=document.getElementById('node-'+nodeId);
  if(el) el.classList.add('selected');
  selectedNodeId=nodeId;
  var supplyColor=node.supply_level==='risky'?'#f87171':node.supply_level==='tight'?'#facc15':'#4ade80';
  var supplyLabel=node.supply_level==='risky'?'&#9888; 断供风险':node.supply_level==='tight'?'偏紧':'宽松';
  var productsHtml='',processesHtml='',companiesHtml='';
  for(var i=0;i<node.core_products.length;i++)
    productsHtml+='<span style="background:rgba(99,102,241,.1);color:#818cf8;padding:3px 10px;border-radius:8px;font-size:12px">'+esc(node.core_products[i])+'</span>';
  for(var i=0;i<node.core_processes.length;i++)
    processesHtml+='<span style="background:rgba(251,146,60,.08);color:#fb923c;padding:3px 10px;border-radius:8px;font-size:12px">'+esc(node.core_processes[i])+'</span>';
  for(var i=0;i<node.companies.length;i++) companiesHtml+=renderCompanyCard(node.companies[i],node.id);
  var html='<div class="dp-header"><div class="dp-title"><h2>'+esc(node.name)+'</h2><p>'+esc(node.type)+' &middot; '+esc(LAYER_LABELS[node.layer]||'')+'</p></div>'
    +'<button class="dp-close" onclick="closeDetail()">&#10005;</button></div>'
    +'<div class="dp-section"><div class="dp-section-title">节点说明</div><p style="font-size:13px;color:#94a3b8;line-height:1.6">'+esc(node.description)+'</p></div>'
    +'<div class="dp-section"><div class="dp-section-title">核心产品 / 工艺</div>'
    +'<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">'+productsHtml+'</div>'
    +'<div style="display:flex;flex-wrap:wrap;gap:6px">'+processesHtml+'</div></div>'
    +'<div class="dp-section"><div class="dp-section-title">供需格局</div>'
    +'<div class="supply-grid">'
    +'<div class="supply-item"><div class="val" style="color:#4ade80">'+node.domestic_rate+'%</div><div class="lbl">国产替代率</div></div>'
    +'<div class="supply-item"><div class="val" style="color:'+supplyColor+'">'+supplyLabel+'</div><div class="lbl">产能瓶颈</div></div>'
    +'</div>'+(node.price_note?'<p style="font-size:11px;color:#64748b;margin-top:10px">&#128176; '+esc(node.price_note)+'</p>':'')+'</div>'
    +'<div class="dp-section"><div class="dp-section-title">头部企业（'+node.companies.length+' 家）</div>'
    +companiesHtml
    +(node.companies.length<5?'<p style="font-size:11px;color:#475569;margin-top:6px">该环节目前收录 '+node.companies.length+' 家企业</p>':'')
    +'</div>';
  document.getElementById('detailContent').innerHTML=html;
  document.getElementById('detailPanel').classList.add('open');
}

function renderCompanyCard(c,nodeId){
  var isHolding=holdingMode&&HOLDING_STOCKS.has(c.code);
  var patentMark='';
  if(c.patent_count>=5) patentMark='<span class="cc-patent" title="持有'+c.patent_count+'件核心专利">&#128300;'+c.patent_count+'</span>';
  else if(c.patent_count>=1) patentMark='<span class="cc-patent" style="opacity:.5" title="'+c.patent_count+'件">&#128300;</span>';
  var purityBadge=getPurityBadge(c.revenue_ratio,c.gross_margin);
  // 数据来源标
  var srcMap={official:'src-official',authoritative:'src-authoritative',reference:'src-reference'};
  var srcLabel={official:'① 官方',authoritative:'② 权威',reference:'③ 参考'};
  var srcTip={official:'数据来源：公司年报/交易所公告',authoritative:'数据来源：行业协会/市场研究机构',reference:'数据来源：券商研报估算，置信度较低'};
  var srcType=c.source_type||'reference';
  var srcHtml='<span class="src-badge '+srcMap[srcType]+'" title="'+esc(srcTip[srcType])+'">'+srcLabel[srcType]+'</span>';
  var tags='';
  if(c.is_entity_list) tags+='<span class="ctag ctag-entity">&#9888;&#65039; 实体清单</span>';
  if(c.is_small_giant) tags+='<span class="ctag ctag-giant">专精特新·小巨人</span>';
  else if(c.is_specialized) tags+='<span class="ctag ctag-specialized">专精特新</span>';
  if(c.is_big_fund) tags+='<span class="ctag ctag-bigfund">大基金持仓</span>';
  var isListed=c.code&&c.code!=='未上市'&&c.code!=='——'&&c.exchange!=='——';
  var fmtPct=function(v){return(v===null||v===undefined)?'<span style="color:#475569">—</span>':v+'%';};
  var codeAndName=isListed
    ?'<span class="cc-identity"><span class="cc-code">'+esc(c.code)+'</span><span class="cc-name">'+esc(c.name)+'</span></span>'
    :'<span class="cc-identity"><span class="cc-code" style="background:rgba(148,163,184,.08);color:#64748b">未上市</span><span class="cc-name">'+esc(c.name)+'</span></span>';
  var leaderHtml=c.is_leader?'<span class="leader-badge">&#9733; 龙头</span>':'';
  var clickAttr=nodeId?' onclick="showCompanyDetail(\''+esc(nodeId)+'\',\''+esc(c.id)+'\')"':'';
  // 市场份额标注
  var msHtml='';
  if(c.market_share){
    msHtml='<div style="font-size:10px;color:#4ade80;font-weight:700;margin-bottom:6px">&#128200; '+esc(c.market_share)+'</div>';
  }
  return '<div class="company-card'+(isHolding?' is-holding':'')+'"'+clickAttr+'>'
    +(isHolding?'<div class="holding-badge">&#128204; 持仓</div>':'')
    +'<div class="cc-top">'+codeAndName+leaderHtml+patentMark+srcHtml
    +'<span style="flex:1"></span>'+purityBadge+'</div>'
    +msHtml
    +'<div class="cc-core">'+esc(c.core)+'</div>'
    +'<div class="cc-purity">'
    +'<div class="purity-item"><div class="pv">'+fmtPct(c.revenue_ratio)+'</div><div class="pl">营收占比</div></div>'
    +'<div class="purity-item"><div class="pv">'+fmtPct(c.gross_margin)+'</div><div class="pl">毛利率</div></div>'
    +'<div class="purity-item"><div class="pv">'+fmtPct(c.client_concentration)+'</div><div class="pl">客户集中度</div></div>'
    +'</div>'+(tags?'<div class="cc-tags">'+tags+'</div>':'')+'</div>';
}

function showCompanyDetail(nodeId,companyId){
  var industry=INDUSTRY_DATA[currentIndustry],node=null,company=null;
  for(var i=0;i<industry.nodes.length;i++){
    if(industry.nodes[i].id===nodeId){node=industry.nodes[i];break;}
  }
  if(!node) return;
  for(var i=0;i<node.companies.length;i++){
    if(node.companies[i].id===companyId){company=node.companies[i];break;}
  }
  if(!company) return;

  var isListed=company.code&&company.code!=='未上市'&&company.code!=='——'&&company.exchange!=='——';
  var fmtPct=function(v){return(v===null||v===undefined)?'<span style="color:#475569">—</span>':v+'%';};

  var srcMap={official:'src-official',authoritative:'src-authoritative',reference:'src-reference'};
  var srcLabel={official:'① 官方',authoritative:'② 权威',reference:'③ 参考'};
  var srcType=company.source_type||'reference';

  // 头部
  var html='<div class="dp-header">'
    +'<div class="dp-title"><h2>'+esc(company.name)+'</h2>'
    +'<p>'+(isListed?esc(company.code)+' · '+esc(company.exchange):'未上市公司')+'</p></div>'
    +'<div style="display:flex;gap:8px;align-items:center">'
    +'<button class="cd-back" onclick="showDetail(\''+esc(nodeId)+'\')">&#8592; 返回节点</button>'
    +'<button class="dp-close" onclick="closeDetail()">&#10005;</button>'
    +'</div></div>';

  // 市场份额
  if(company.market_share){
    html+='<div class="dp-section"><div class="dp-section-title">市场地位</div>'
      +'<div class="cd-market-share-bar">'
      +'<div class="cd-ms-label">市场份额</div>'
      +'<div class="cd-ms-value">'+esc(company.market_share.split('，')[0])+'</div>'
      +'<div class="cd-ms-detail">'+esc(company.market_share)+'</div>'
      +'</div></div>';
  } else {
    html+='<div class="dp-section"><div class="dp-section-title">市场地位</div>'
      +'<p style="font-size:12px;color:#475569">市场份额数据暂未录入</p></div>';
  }

  // 入选理由
  html+='<div class="dp-section"><div class="dp-section-title">入选理由</div>'
    +(company.analysis
      ?'<div class="cd-analysis">'+esc(company.analysis)+'</div>'
      :'<p style="font-size:12px;color:#475569">分析说明暂未录入</p>')
    +'</div>';

  // 财务指标
  html+='<div class="dp-section"><div class="dp-section-title">财务指标 '
    +'<span class="src-badge '+srcMap[srcType]+'" title="数据来源置信度">'+srcLabel[srcType]+'</span></div>'
    +'<div class="supply-grid" style="grid-template-columns:repeat(3,1fr)">'
    +'<div class="supply-item"><div class="val">'+fmtPct(company.revenue_ratio)+'</div><div class="lbl">营收占比</div></div>'
    +'<div class="supply-item"><div class="val">'+fmtPct(company.gross_margin)+'</div><div class="lbl">毛利率</div></div>'
    +'<div class="supply-item"><div class="val">'+fmtPct(company.client_concentration)+'</div><div class="lbl">客户集中度</div></div>'
    +'</div>'
    +(company.patent_count?'<p style="font-size:11px;color:#64748b;margin-top:8px">&#128300; 核心专利 '+company.patent_count+' 件（'+esc(company.patent_type==='invention'?'发明专利':company.patent_type==='utility'?'实用新型':'发明+实用')+'）</p>':'')
    +'</div>';

  // 资质标注
  var tags='';
  if(company.is_entity_list) tags+='<span class="ctag ctag-entity">&#9888;&#65039; 美国实体清单</span>';
  if(company.is_small_giant) tags+='<span class="ctag ctag-giant">专精特新·小巨人</span>';
  else if(company.is_specialized) tags+='<span class="ctag ctag-specialized">专精特新</span>';
  if(company.is_big_fund) tags+='<span class="ctag ctag-bigfund">大基金持仓</span>';
  if(tags) html+='<div class="dp-section"><div class="dp-section-title">资质标注</div><div class="cc-tags">'+tags+'</div></div>';

  // 关联上市公司穿透（仅未上市公司）
  if(!isListed){
    var relations=company.listed_relations||[];
    html+='<div class="dp-section"><div class="dp-section-title">&#128279; 关联上市公司穿透</div>';
    if(relations.length===0){
      html+='<div class="cd-no-relation">暂无已确认的上市关联方数据</div>';
    } else {
      html+='<div class="cd-relation-list">';
      for(var i=0;i<relations.length;i++){
        var r=relations[i];
        html+='<div class="cd-relation-item">'
          +'<span class="cc-identity"><span class="cc-code">'+esc(r.code)+'</span><span class="cc-name">'+esc(r.name)+'</span></span>'
          +'<span class="cd-relation-type">'+esc(r.relation)+'</span>'
          +(r.stake?'<span class="cd-stake">'+esc(r.stake)+'</span>':'<span class="cd-stake" style="color:#475569">持股比例未披露</span>')
          +'</div>';
      }
      html+='</div>';
    }
    html+='</div>';
  }

  document.getElementById('detailContent').innerHTML=html;
  document.getElementById('detailPanel').classList.add('open');
}

function getPurityBadge(rev,gross){
  if(rev===null||rev===undefined) return '<span class="purity-badge pb-mixed">数据缺失</span>';
  if(rev<30) return '<span class="purity-badge pb-concept">&#9888; 蹭概念</span>';
  if(rev>=70&&gross>=40) return '<span class="purity-badge pb-strong">主业·强护城河</span>';
  if(rev>=70) return '<span class="purity-badge pb-main">主业</span>';
  if(gross>=40) return '<span class="purity-badge pb-mixed">多元·强护城河</span>';
  return '<span class="purity-badge pb-mixed">多元化</span>';
}

function closeDetail(){
  document.getElementById('detailPanel').classList.remove('open');
  var prevSel=document.querySelectorAll('.chain-node.selected');
  for(var i=0;i<prevSel.length;i++) prevSel[i].classList.remove('selected');
  selectedNodeId=null;
}

function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

var ro=new ResizeObserver(function(){drawConnections();});
ro.observe(document.getElementById('chainArea'));

document.getElementById('btnHolding').classList.toggle('active',holdingMode);

async function initIndustryPage(){
  await loadIndustryData();
  var ids = Object.keys(INDUSTRY_DATA);
  if(ids.length && !INDUSTRY_DATA[currentIndustry]) currentIndustry = ids[0];
  renderTabs();
  renderCurrentIndustry();
}

initIndustryPage();
</script>
