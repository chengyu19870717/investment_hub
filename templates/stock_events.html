<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重要时间节点 · 程钰的百宝箱</title>
<link rel="stylesheet" href="/static/css/style.css?v=12">
<style>
/* ── 布局 ─────────────────────────────────────────────── */
.ev-layout { display:flex; gap:0; height:calc(100vh - 120px); min-height:500px; }
.ev-sidebar {
  width:220px; flex-shrink:0; border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow-y:auto; padding:12px 0;
}
.ev-main { flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; }

/* ── 侧边栏：股票列表 ──────────────────────────────────── */
.sb-title { font-size:11px; font-weight:700; color:var(--text-muted);
  letter-spacing:.06em; padding:0 16px 8px; text-transform:uppercase; }
.sb-item {
  display:flex; align-items:center; gap:8px; padding:9px 16px;
  cursor:pointer; transition:background .15s; border-left:3px solid transparent;
}
.sb-item:hover { background:var(--bg-card-hover); }
.sb-item.active { background:var(--accent-light); border-left-color:var(--accent); }
.sb-code { font-size:11px; font-weight:700; color:var(--accent);
  background:var(--accent-light); padding:1px 6px; border-radius:4px; white-space:nowrap; }
.sb-name { font-size:13px; color:var(--text-primary); flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sb-badge { font-size:10px; font-weight:700; background:#fee2e2; color:#dc2626;
  border-radius:8px; padding:0 6px; flex-shrink:0; }
.sb-badge.soon { background:#fef9c3; color:#ca8a04; }
.sb-all { font-size:13px; font-weight:600; color:var(--text-primary); }

/* ── 工具栏 ───────────────────────────────────────────── */
.ev-toolbar {
  display:flex; align-items:center; gap:8px; padding:12px 16px;
  border-bottom:1px solid var(--border); flex-wrap:wrap; flex-shrink:0;
}
.ev-filter-group { display:flex; gap:4px; flex-wrap:wrap; }
.filter-btn {
  padding:4px 12px; border-radius:16px; border:1px solid var(--border);
  background:var(--bg-card); color:var(--text-muted); font-size:12px;
  cursor:pointer; transition:all .15s; white-space:nowrap;
}
.filter-btn:hover { border-color:var(--accent); color:var(--accent); }
.filter-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.ev-spacer { flex:1; }
.ev-search {
  padding:6px 12px; border:1px solid var(--border); border-radius:8px;
  font-size:13px; background:var(--bg-page); color:var(--text-primary);
  outline:none; width:180px;
}
.ev-search:focus { border-color:var(--accent); }

/* ── 时间轴容器 ───────────────────────────────────────── */
.ev-scroll { flex:1; overflow-y:auto; padding:16px 20px; }
.timeline-group { margin-bottom:28px; }
.tl-month {
  font-size:12px; font-weight:700; color:var(--text-muted);
  letter-spacing:.05em; margin-bottom:10px;
  display:flex; align-items:center; gap:8px;
}
.tl-month::after { content:''; flex:1; height:1px; background:var(--border); }

/* ── 事件卡片 ─────────────────────────────────────────── */
.ev-card {
  display:flex; gap:12px; align-items:flex-start;
  background:var(--bg-card); border-radius:12px; padding:14px 16px;
  margin-bottom:8px; border:1px solid var(--border);
  box-shadow:var(--shadow); transition:all .2s; position:relative;
}
.ev-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.08); transform:translateY(-1px); }
.ev-card.done { opacity:.55; }
.ev-card.done .ev-title { text-decoration:line-through; }
.ev-card.cancelled { opacity:.4; }

/* 左侧日期栏 */
.ev-date-col {
  flex-shrink:0; width:52px; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
.ev-day { font-size:22px; font-weight:800; line-height:1; color:var(--text-primary); }
.ev-weekday { font-size:10px; color:var(--text-muted); font-weight:600; }
.ev-countdown {
  font-size:10px; font-weight:700; padding:2px 6px; border-radius:6px;
  margin-top:4px; white-space:nowrap;
}
.ev-countdown.today  { background:#dcfce7; color:#16a34a; }
.ev-countdown.soon   { background:#fef9c3; color:#ca8a04; }
.ev-countdown.urgent { background:#fee2e2; color:#dc2626; }
.ev-countdown.past   { background:#f1f5f9; color:#94a3b8; }
.ev-countdown.future { background:#eff6ff; color:#2563eb; }

/* 中间分隔线 */
.ev-divider { width:1px; background:var(--border); align-self:stretch; flex-shrink:0; }

/* 右侧内容 */
.ev-body { flex:1; min-width:0; }
.ev-header { display:flex; align-items:flex-start; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
.ev-title { font-size:14px; font-weight:700; color:var(--text-primary); flex:1; min-width:0; }
.ev-stock-badge {
  display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700;
  background:var(--accent-light); color:var(--accent);
  padding:2px 8px; border-radius:6px; white-space:nowrap; flex-shrink:0;
}
.ev-type-badge {
  font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; white-space:nowrap; flex-shrink:0;
}
.ev-desc { font-size:12px; color:var(--text-muted); margin-bottom:6px; line-height:1.5; }
.ev-footer { display:flex; align-items:center; gap:8px; }
.imp-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }

/* 重要性颜色 */
.imp-high   .imp-dot { background:#ef4444; }
.imp-normal .imp-dot { background:#94a3b8; }
.imp-low    .imp-dot { background:#cbd5e1; }
.imp-high   .ev-card { border-left:3px solid #ef4444; }

/* 类型颜色 */
.type-业绩 { background:#dbeafe; color:#1d4ed8; }
.type-分红 { background:#d1fae5; color:#065f46; }
.type-解禁 { background:#fce7f3; color:#9d174d; }
.type-定增 { background:#fef3c7; color:#92400e; }
.type-重组 { background:#ede9fe; color:#5b21b6; }
.type-调研 { background:#e0f2fe; color:#0369a1; }
.type-公告 { background:#f1f5f9; color:#475569; }
.type-其他 { background:#f1f5f9; color:#64748b; }

/* 操作按钮 */
.ev-actions { display:flex; gap:4px; flex-shrink:0; margin-left:auto; }
.ev-btn {
  border:none; background:none; color:var(--text-muted); cursor:pointer;
  padding:3px 6px; border-radius:6px; font-size:13px; transition:all .15s;
}
.ev-btn:hover { background:var(--bg-card-hover); color:var(--text-primary); }
.ev-btn.done-btn:hover { color:#16a34a; background:#dcfce7; }
.ev-btn.edit-btn:hover { color:var(--accent); background:var(--accent-light); }
.ev-btn.del-btn:hover  { color:#ef4444; background:#fee2e2; }

/* ── 空状态 ───────────────────────────────────────────── */
.ev-empty { text-align:center; padding:60px 20px; color:var(--text-muted); }
.ev-empty .emoji { font-size:48px; margin-bottom:12px; }

/* ── Modal ────────────────────────────────────────────── */
.modal-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.4);
  z-index:1000; align-items:center; justify-content:center;
}
.modal-overlay.open { display:flex; }
.modal-box {
  background:var(--bg-card); border-radius:16px; width:520px; max-width:95vw;
  max-height:90vh; display:flex; flex-direction:column;
  box-shadow:0 16px 48px rgba(0,0,0,.2); overflow:hidden;
}
.modal-head {
  display:flex; align-items:center; padding:18px 22px;
  border-bottom:1px solid var(--border);
}
.modal-head h2 { font-size:15px; font-weight:700; flex:1; }
.modal-close { border:none; background:none; font-size:20px; color:var(--text-muted);
  cursor:pointer; padding:0; line-height:1; }
.modal-body { padding:20px 22px; overflow-y:auto; flex:1;
  display:flex; flex-direction:column; gap:14px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-group { display:flex; flex-direction:column; gap:5px; }
.form-group.full { grid-column:1/-1; }
.form-label { font-size:12px; font-weight:600; color:var(--text-muted); }
.form-input, .form-select, .form-textarea {
  padding:8px 10px; border:1px solid var(--border); border-radius:8px;
  font-size:13px; background:var(--bg-page); color:var(--text-primary);
  outline:none; font-family:inherit; transition:border-color .15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color:var(--accent); }
.form-textarea { resize:vertical; min-height:64px; }
.modal-foot {
  display:flex; justify-content:flex-end; gap:8px;
  padding:14px 22px; border-top:1px solid var(--border);
}

/* 股票搜索下拉 */
.stock-search-wrap { position:relative; }
.stock-dropdown {
  position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:100;
  background:var(--bg-card); border:1px solid var(--border); border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.12); max-height:180px; overflow-y:auto; display:none;
}
.stock-dropdown.open { display:block; }
.stock-option {
  padding:8px 12px; cursor:pointer; display:flex; align-items:center; gap:8px;
  font-size:13px; transition:background .1s;
}
.stock-option:hover { background:var(--accent-light); }
.stock-option .opt-code { font-size:11px; font-weight:700; color:var(--accent);
  background:var(--accent-light); padding:1px 6px; border-radius:4px; }

/* ── 统计条 ───────────────────────────────────────────── */
.ev-stats {
  display:flex; gap:16px; padding:10px 20px;
  border-bottom:1px solid var(--border); flex-shrink:0; flex-wrap:wrap;
}
.stat-item { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--text-muted); }
.stat-num { font-size:16px; font-weight:800; color:var(--text-primary); }
.stat-urgent .stat-num { color:#dc2626; }
.stat-soon   .stat-num { color:#ca8a04; }
.stat-done   .stat-num { color:#16a34a; }
</style>
</head>
<body>
<div class="page page--wide" style="max-width:100%;padding:0;">
  <header class="header">
    <div class="header-inner">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:12px;">
          {% if not embedded %}
          <a href="/" class="back-btn">←</a>
          {% endif %}
          <div class="logo">
            <span class="logo-icon">📅</span>
            <span class="logo-text">重要时间节点</span>
          </div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn-secondary" onclick="downloadTemplate()" title="下载导入模板">📋 模板</button>
          <label class="btn-secondary" style="cursor:pointer;" title="批量导入CSV">
            📥 导入
            <input type="file" id="importFile" accept=".csv" style="display:none;" onchange="importCSV(this)">
          </label>
          <button class="btn-secondary" onclick="exportCSV()" title="导出全部数据">📤 导出</button>
          <button class="btn-primary" onclick="openModal()">＋ 新增事件</button>
        </div>
      </div>
    </div>
  </header>

  <div class="main" style="padding:0;flex:1;display:flex;flex-direction:column;overflow:hidden;">
    <!-- 统计条 -->
    <div class="ev-stats" id="statsBar"></div>

    <div class="ev-layout">
      <!-- 左侧股票导航 -->
      <div class="ev-sidebar" id="sidebar"></div>

      <!-- 右侧主区域 -->
      <div class="ev-main">
        <!-- 工具栏 -->
        <div class="ev-toolbar">
          <div class="ev-filter-group" id="statusFilter">
            <button class="filter-btn active" data-val="" onclick="setFilter('status','',this)">全部</button>
            <button class="filter-btn" data-val="pending" onclick="setFilter('status','pending',this)">⏳ 待跟踪</button>
            <button class="filter-btn" data-val="done" onclick="setFilter('status','done',this)">✅ 已完成</button>
            <button class="filter-btn" data-val="cancelled" onclick="setFilter('status','cancelled',this)">🚫 已取消</button>
          </div>
          <div class="ev-spacer"></div>
          <div class="ev-filter-group" id="typeFilter">
            <button class="filter-btn active" data-val="" onclick="setFilter('type','',this)">所有类型</button>
            <button class="filter-btn" data-val="业绩" onclick="setFilter('type','业绩',this)">业绩</button>
            <button class="filter-btn" data-val="分红" onclick="setFilter('type','分红',this)">分红</button>
            <button class="filter-btn" data-val="解禁" onclick="setFilter('type','解禁',this)">解禁</button>
            <button class="filter-btn" data-val="定增" onclick="setFilter('type','定增',this)">定增</button>
            <button class="filter-btn" data-val="重组" onclick="setFilter('type','重组',this)">重组</button>
            <button class="filter-btn" data-val="调研" onclick="setFilter('type','调研',this)">调研</button>
            <button class="filter-btn" data-val="公告" onclick="setFilter('type','公告',this)">公告</button>
            <button class="filter-btn" data-val="其他" onclick="setFilter('type','其他',this)">其他</button>
          </div>
          <input class="ev-search" id="searchInput" placeholder="搜索事件标题…" oninput="renderTimeline()">
        </div>

        <!-- 时间轴 -->
        <div class="ev-scroll" id="timelineArea"></div>
      </div>
    </div>
  </div>
</div>

<!-- 新增/编辑 Modal -->
<div class="modal-overlay" id="modal" onclick="handleOverlayClick(event)">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitle">新增事件</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-row">
        <!-- 股票搜索 -->
        <div class="form-group">
          <label class="form-label">股票 *</label>
          <div class="stock-search-wrap">
            <input class="form-input" id="stockInput" placeholder="代码或名称搜索…"
              autocomplete="off" oninput="onStockSearch()" onblur="hideDropdown()">
            <input type="hidden" id="stockCode">
            <input type="hidden" id="stockName">
            <div class="stock-dropdown" id="stockDropdown"></div>
          </div>
        </div>
        <!-- 日期 -->
        <div class="form-group">
          <label class="form-label">日期 *</label>
          <input class="form-input" type="date" id="eventDate">
        </div>
      </div>
      <div class="form-group full">
        <label class="form-label">事件标题 *</label>
        <input class="form-input" id="eventTitle" placeholder="如：半年报披露、限售股解禁">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">事件类型</label>
          <select class="form-select" id="eventType">
            <option value="业绩">业绩</option>
            <option value="分红">分红</option>
            <option value="解禁">解禁</option>
            <option value="定增">定增</option>
            <option value="重组">重组</option>
            <option value="调研">调研</option>
            <option value="公告">公告</option>
            <option value="其他" selected>其他</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">重要程度</label>
          <select class="form-select" id="eventImportance">
            <option value="high">🔴 高</option>
            <option value="normal" selected>⚪ 普通</option>
            <option value="low">🔵 低</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">状态</label>
        <select class="form-select" id="eventStatus">
          <option value="pending" selected>⏳ 待跟踪</option>
          <option value="done">✅ 已完成</option>
          <option value="cancelled">🚫 已取消</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">备注说明</label>
        <textarea class="form-textarea" id="eventDesc" placeholder="事件详情、关注要点…"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn-primary" onclick="saveEvent()">保存</button>
    </div>
  </div>
</div>

<script>
// ── 状态 ──────────────────────────────────────────────────
let allEvents  = [];
let watchlist  = [];
let filterCode   = '';
let filterStatus = '';
let filterType   = '';

const WEEKDAYS = ['日','一','二','三','四','五','六'];
const TODAY = new Date(); TODAY.setHours(0,0,0,0);

// ── 初始化 ────────────────────────────────────────────────
async function init() {
  const [evRes, wlRes] = await Promise.all([
    fetch('/api/stock-events').then(r=>r.json()),
    fetch('/api/watchlist').then(r=>r.json()),
  ]);
  allEvents = evRes;
  watchlist = wlRes;
  renderAll();
}

function renderAll() {
  renderStats();
  renderSidebar();
  renderTimeline();
}

// ── 统计条 ────────────────────────────────────────────────
function renderStats() {
  const now = Date.now();
  const pending = allEvents.filter(e=>e.status==='pending');
  const urgent  = pending.filter(e=>daysDiff(e.event_date)<=3 && daysDiff(e.event_date)>=0).length;
  const soon    = pending.filter(e=>daysDiff(e.event_date)>3 && daysDiff(e.event_date)<=14).length;
  const done    = allEvents.filter(e=>e.status==='done').length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-item stat-urgent"><span class="stat-num">${urgent}</span>3天内到期</div>
    <div class="stat-item stat-soon"><span class="stat-num">${soon}</span>14天内</div>
    <div class="stat-item"><span class="stat-num">${pending.length}</span>待跟踪</div>
    <div class="stat-item stat-done"><span class="stat-num">${done}</span>已完成</div>
    <div class="stat-item"><span class="stat-num">${allEvents.length}</span>全部事件</div>
  `;
}

// ── 侧边栏 ────────────────────────────────────────────────
function renderSidebar() {
  // 合并 watchlist 和已有事件的股票
  const codeMap = {};
  watchlist.forEach(([code, name]) => codeMap[code] = name);
  allEvents.forEach(e => { if (!codeMap[e.stock_code]) codeMap[e.stock_code] = e.stock_name; });

  // 统计每只股票待跟踪/紧急数量
  const stats = {};
  allEvents.filter(e=>e.status==='pending').forEach(e => {
    if (!stats[e.stock_code]) stats[e.stock_code] = {total:0, urgent:0, soon:0};
    stats[e.stock_code].total++;
    const d = daysDiff(e.event_date);
    if (d>=0 && d<=3) stats[e.stock_code].urgent++;
    else if (d>3 && d<=14) stats[e.stock_code].soon++;
  });

  let html = `<div class="sb-title">关注股票</div>`;
  // 全部
  const total = allEvents.filter(e=>e.status==='pending').length;
  html += `<div class="sb-item ${filterCode===''?'active':''}" onclick="selectCode('')">
    <span class="sb-all">📋 全部事件</span>
    ${total?`<span class="sb-badge">${total}</span>`:''}
  </div>`;

  Object.entries(codeMap).forEach(([code, name]) => {
    const s = stats[code] || {};
    const badge = s.urgent ? `<span class="sb-badge">${s.urgent}</span>`
                : s.soon   ? `<span class="sb-badge soon">${s.soon}</span>` : '';
    html += `<div class="sb-item ${filterCode===code?'active':''}" onclick="selectCode('${code}')">
      <span class="sb-code">${esc(code)}</span>
      <span class="sb-name">${esc(name||code)}</span>
      ${badge}
    </div>`;
  });
  document.getElementById('sidebar').innerHTML = html;
}

// ── 时间轴 ────────────────────────────────────────────────
function renderTimeline() {
  const q = (document.getElementById('searchInput').value||'').toLowerCase();
  let events = allEvents.filter(e => {
    if (filterCode   && e.stock_code !== filterCode) return false;
    if (filterStatus && e.status !== filterStatus)   return false;
    if (filterType   && e.event_type !== filterType)  return false;
    if (q && !e.event_title.toLowerCase().includes(q) && !(e.stock_name||'').toLowerCase().includes(q)) return false;
    return true;
  });

  // 排序：未来事件按日期正序，过去事件放最后
  events.sort((a,b) => {
    const da = daysDiff(a.event_date), db = daysDiff(b.event_date);
    if (da>=0 && db>=0) return da - db;
    if (da<0  && db<0 ) return db - da;
    return da>=0 ? -1 : 1;
  });

  if (!events.length) {
    document.getElementById('timelineArea').innerHTML = `
      <div class="ev-empty"><div class="emoji">📭</div><div>暂无事件，点击右上角「＋ 新增事件」添加</div></div>`;
    return;
  }

  // 按月分组
  const groups = {};
  events.forEach(e => {
    const d = daysDiff(e.event_date);
    const key = d < 0 ? e.event_date.slice(0,7) : (d <= 90 ? '近期（90天内）' : e.event_date.slice(0,7));
    if (!groups[key]) groups[key] = [];
    groups[key].push(e);
  });

  // 排序：近期在前，历史在后
  const sortedKeys = Object.keys(groups).sort((a,b) => {
    const aIsNear = a === '近期（90天内）';
    const bIsNear = b === '近期（90天内）';
    if (aIsNear) return -1; if (bIsNear) return 1;
    return a > b ? 1 : -1;
  });

  let html = '';
  sortedKeys.forEach(key => {
    html += `<div class="timeline-group"><div class="tl-month">${esc(key)}</div>`;
    groups[key].forEach(e => html += renderCard(e));
    html += '</div>';
  });
  document.getElementById('timelineArea').innerHTML = html;
}

function renderCard(e) {
  const d   = daysDiff(e.event_date);
  const dt  = new Date(e.event_date + 'T00:00:00');
  const day = dt.getDate();
  const wk  = WEEKDAYS[dt.getDay()];

  let cdClass = 'future', cdText = `${d}天后`;
  if (d === 0)      { cdClass='today';  cdText='今天'; }
  else if (d < 0)   { cdClass='past';   cdText=`${Math.abs(d)}天前`; }
  else if (d <= 3)  { cdClass='urgent'; cdText=`${d}天后`; }
  else if (d <= 14) { cdClass='soon';   cdText=`${d}天后`; }

  const statusIcon = e.status==='done' ? '✅' : e.status==='cancelled' ? '🚫' : '';
  const impClass = `imp-${e.importance||'normal'}`;
  const typeClass = `type-${e.event_type||'其他'}`;

  return `<div class="ev-card ${e.status} ${impClass}">
    <div class="ev-date-col">
      <div class="ev-day">${day}</div>
      <div class="ev-weekday">周${wk}</div>
      <div class="ev-countdown ${cdClass}">${cdText}</div>
    </div>
    <div class="ev-divider"></div>
    <div class="ev-body">
      <div class="ev-header">
        <div class="ev-title">${statusIcon} ${esc(e.event_title)}</div>
        <span class="ev-stock-badge">${esc(e.stock_code)} ${esc(e.stock_name||'')}</span>
        <span class="ev-type-badge ${typeClass}">${esc(e.event_type||'其他')}</span>
      </div>
      ${e.event_desc ? `<div class="ev-desc">${esc(e.event_desc)}</div>` : ''}
      <div class="ev-footer">
        <div class="imp-dot"></div>
        <span style="font-size:11px;color:var(--text-muted);">${e.importance==='high'?'重要':e.importance==='low'?'低优先级':'普通'}</span>
        <span style="font-size:11px;color:var(--text-muted);margin-left:4px;">${e.event_date}</span>
        <div class="ev-actions">
          ${e.status==='pending'?`<button class="ev-btn done-btn" onclick="quickDone(${e.id})" title="标记完成">✓</button>`:''}
          <button class="ev-btn edit-btn" onclick="openEditModal(${e.id})" title="编辑">✏️</button>
          <button class="ev-btn del-btn" onclick="deleteEvent(${e.id})" title="删除">🗑️</button>
        </div>
      </div>
    </div>
  </div>`;
}

// ── 工具函数 ──────────────────────────────────────────────
function daysDiff(dateStr) {
  const d = new Date(dateStr + 'T00:00:00'); d.setHours(0,0,0,0);
  return Math.round((d - TODAY) / 86400000);
}
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

// ── 过滤器 ────────────────────────────────────────────────
function setFilter(type, val, btn) {
  if (type === 'status') { filterStatus = val; updateBtns('statusFilter', btn); }
  else                   { filterType   = val; updateBtns('typeFilter', btn); }

}
function updateBtns(groupId, activeBtn) {

function selectCode(code) {

// ── 股票搜索 ──────────────────────────────────────────────
let searchTimer;
function onStockSearch() {
  clearTimeout(searchTimer);
  document.getElementById('stockCode').value = '';
  document.getElementById('stockName').value = '';
  searchTimer = setTimeout(async () => {
    const q = document.getElementById('stockInput').value.trim();
    if (!q) { hideDropdown(); return; }

    // 先从 watchlist 中筛选
    const hits = watchlist.filter(([code, name]) =>
      code.includes(q) || name.includes(q)
    ).slice(0, 8);

    if (!hits.length) {
      // fallback：调接口搜索
      try {
        const res = await fetch('/api/stock/search?q=' + encodeURIComponent(q)).then(r=>r.json());
        showDropdown(res.map(s => [s.code || s[0], s.name || s[1]]));
      } catch { showDropdown([]); }
    } else {
      showDropdown(hits);
    }
  }, 250);
}

function showDropdown(stocks) {
  const dd = document.getElementById('stockDropdown');
  if (!stocks.length) { dd.classList.remove('open'); return; }
  dd.innerHTML = stocks.map(([code, name]) =>
    `<div class="stock-option" onmousedown="selectStock('${esc(code)}','${esc(name)}')">`+
    `<span class="opt-code">${esc(code)}</span><span>${esc(name)}</span></div>`
  ).join('');
  dd.classList.add('open');
}
function hideDropdown() { setTimeout(() => document.getElementById('stockDropdown').classList.remove('open'), 150); }
function selectStock(code, name) {
  document.getElementById('stockInput').value = `${code}  ${name}`;
  document.getElementById('stockCode').value  = code;
  document.getElementById('stockName').value  = name;
  document.getElementById('stockDropdown').classList.remove('open');
}

// ── Modal ─────────────────────────────────────────────────
function openModal(prefillCode, prefillName) {
  document.getElementById('editId').value      = '';
  document.getElementById('stockInput').value  = prefillCode ? `${prefillCode}  ${prefillName||''}` : '';
  document.getElementById('stockCode').value   = prefillCode || '';
  document.getElementById('stockName').value   = prefillName || '';
  document.getElementById('eventDate').value   = '';
  document.getElementById('eventTitle').value  = '';
  document.getElementById('eventType').value   = '其他';
  document.getElementById('eventImportance').value = 'normal';
  document.getElementById('eventStatus').value = 'pending';
  document.getElementById('eventDesc').value   = '';
  document.getElementById('modalTitle').textContent = '新增事件';
  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('eventTitle').focus(), 100);
}

function openEditModal(id) {
  const e = allEvents.find(x => x.id === id);
  if (!e) return;
  document.getElementById('editId').value      = e.id;
  document.getElementById('stockInput').value  = `${e.stock_code}  ${e.stock_name||''}`;
  document.getElementById('stockCode').value   = e.stock_code;
  document.getElementById('stockName').value   = e.stock_name || '';
  document.getElementById('eventDate').value   = e.event_date;
  document.getElementById('eventTitle').value  = e.event_title;
  document.getElementById('eventType').value   = e.event_type || '其他';
  document.getElementById('eventImportance').value = e.importance || 'normal';
  document.getElementById('eventStatus').value = e.status || 'pending';
  document.getElementById('eventDesc').value   = e.event_desc || '';
  document.getElementById('modalTitle').textContent = '编辑事件';
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }
function handleOverlayClick(e) { if (e.target === document.getElementById('modal')) closeModal(); }

async function saveEvent() {
  const code  = document.getElementById('stockCode').value.trim();
  const date  = document.getElementById('eventDate').value.trim();
  const title = document.getElementById('eventTitle').value.trim();
  if (!code)  { alert('请选择股票'); return; }
  if (!date)  { alert('请选择日期'); return; }
  if (!title) { alert('请填写事件标题'); return; }

  const data = {
    stock_code:  code,
    stock_name:  document.getElementById('stockName').value.trim(),
    event_date:  date,
    event_title: title,
    event_type:  document.getElementById('eventType').value,
    importance:  document.getElementById('eventImportance').value,
    status:      document.getElementById('eventStatus').value,
    event_desc:  document.getElementById('eventDesc').value.trim(),
  };
  const editId = document.getElementById('editId').value;
  const url    = editId ? `/api/stock-events/${editId}` : '/api/stock-events';
  const method = editId ? 'PUT' : 'POST';
  await fetch(url, { method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
  closeModal();
  await reload();
}

// ── 快捷操作 ─────────────────────────────────────────────
async function quickDone(id) {
  await fetch(`/api/stock-events/${id}/status`, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({status:'done'})
  });
  await reload();
}
async function deleteEvent(id) {
  if (!confirm('确认删除该事件？')) return;
  await fetch(`/api/stock-events/${id}`, {method:'DELETE'});
  await reload();
}

async function reload() {
  allEvents = await fetch('/api/stock-events').then(r=>r.json());
  renderAll();
}

// ── 导入/导出 ─────────────────────────────────────────────
function downloadTemplate() { window.location = '/api/stock-events/template'; }
function exportCSV()        { window.location = '/api/stock-events/export'; }

async function importCSV(input) {
  const file = input.files[0]; if (!file) return;
  const body = await file.arrayBuffer();
  const res  = await fetch('/api/stock-events/import', {
    method:'POST', headers:{'Content-Type':'text/csv'},
    body
  });
  const data = await res.json();
  if (data.ok) {
    alert(`✅ 成功导入 ${data.count} 条事件`);
    await reload();
  } else {
    alert('导入失败：' + (data.error||'未知错误'));
  }
  input.value = '';
}

init();
